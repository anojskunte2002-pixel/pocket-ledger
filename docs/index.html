}

/* ---------- a compact summary Claude can read ---------- */
function buildDigest(A) {
  const n = v => String(Math.round(v * 100) / 100);
  const L = [];
  const h = household();
  L.push('Today: ' + A.today + '. Currency: ' + FMT.cur + '. Budget months start on day ' + settings().startDay + '.');
  if (!h.solo) L.push('Household: ' + h.members.map(m => m.name).join(' and ') + ', who keep separate incomes. Every expense records who paid and who it is for (one of them, or both). Shared costs are split ' + splitLabel() + ' (' + h.members[0].name + ' first).' + (A.person === 'joint' ? ' This summary covers shared money only.' : A.person !== 'all' ? ' This summary covers ' + memberName(A.person) + ' only: their own spending plus their share of shared costs, and their own income plus their share of shared income.' : ''));
  L.push('Selected period: ' + A.p.start + ' to ' + A.p.end + (A.isCurrent ? ' (day ' + A.dayIndex + ' of ' + A.p.days + ')' : '') + '.');
  L.push('This period: spent ' + n(A.spend) + ', income ' + n(A.income) + ', invested ' + n(A.invest) + ', transfers and card bills (not spending) ' + n(A.transfer) + ', entries ' + A.count + '.' + (A.isCurrent ? ' Projected spending by period end: ' + n(A.projection) + '.' : ''));
  if (A.person === 'all' && A.people && A.people.p1) L.push('Each person this period: ' + ['p1', 'p2'].map(w => { const P = A.people[w]; return memberName(w) + ' earned ' + n(P.earned) + ', spent ' + n(P.spent) + ' (own ' + n(P.own) + ' + share of shared ' + n(P.shared) + '), invested ' + n(P.invested) + ', saved ' + n(P.saved) + ', paid out of pocket ' + n(P.paid) + ' (of which shared costs ' + n(P.paidShared) + ')'; }).join('; ') + '. Shared spending this period: ' + n(A.sharedSpend) + '.');
  if (!h.solo) { const b = balanceNow(); if (b) L.push(b.amount ? 'Balance across everything logged: ' + memberName(b.from) + ' owes ' + memberName(b.to) + ' ' + n(b.amount) + '.' : 'Balance across everything logged: all square.'); }
  if (A.person === 'p1' || A.person === 'p2') L.push(memberName(A.person) + ' this period: own spending ' + n(A.own) + ', share of shared costs ' + n(A.shareSpend) + ' (of ' + n(A.sharedTotal) + ' shared), money that left their pocket ' + n(A.paidOut) + '.');
  L.push('Previous period: spent ' + n(A.prevSpend) + ', income ' + n(A.prevIncome) + (A.isCurrent ? ', spent by the same day: ' + n(A.prevToDate) : '') + '.');
  const cats = Array.from(A.byCat.entries()).filter(([, v]) => v.kind !== 'income').sort((a, b) => b[1].total - a[1].total).slice(0, 14)
    .map(([id, v]) => catById(id).name + ' ' + n(v.total) + ' (prev ' + n((A.prevByCat.get(id) || { total: 0 }).total) + ', 3-mo avg ' + n(A.avgCat.get(id) || 0) + ')');
  if (cats.length) L.push('Outflow by category this period: ' + cats.join('; ') + '.');
  const inc = Array.from(A.incomeBy.entries()).map(([id, v]) => catById(id, 'income').name + ' ' + n(v.total));
  if (inc.length) L.push('Income by source: ' + inc.join('; ') + '.');
  if (A.plan) {
    const P = A.plan;
    L.push('Monthly plan: expected income ' + n(P.expectedIncome) + ' (' + P.incomes.map(r => r.name + ' ' + n(r.amount) + ' ' + r.state).join(', ') + '); fixed costs ' + n(P.fixedTotal) + ' (' + P.fixed.map(r => r.name + ' ' + n(r.amount) + ' due ' + r.due + ' ' + r.state).join(', ') + '); saving goal ' + n(P.save) + '; everyday budget ' + n(P.flexible) + ', everyday spent ' + n(P.everydaySpent) + '.');
  }
  L.push('Last 6 periods (start date: spent / income): ' + A.hist.map(x => x.p.start + ': ' + n(x.spend) + ' / ' + n(x.income)).join('; ') + '.');
  if (A.budgetTotal) L.push('Monthly budget: ' + n(A.budgetTotal) + '.');
  const bc = Object.keys(A.budgetCats).map(id => catById(id).name + ' ' + n(A.budgetCats[id]) + ' (spent ' + n((A.byCat.get(id) || { total: 0 }).total) + ')');
  if (bc.length) L.push('Category budgets: ' + bc.join('; ') + '.');
  if (A.subs.length) L.push('Repeating charges (monthly equivalent): ' + A.subs.slice(0, 10).map(s => s.name + ' ' + n(s.monthly)).join('; ') + '.');
  if (A.topPlaces.length) L.push('Top places this period: ' + A.topPlaces.map(t => t.name + ' ' + n(t.total) + ' (' + t.count + 'x)').join('; ') + '.');
  L.push('Ledger holds ' + A.total + ' entries' + (A.firstDate ? ' since ' + A.firstDate : '') + '.');
  return L.join('\n');
}

/* ===================== charts: SVG + HTML, theme tokens, hover tooltips, table views ===================== */
function niceScale(max, count) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const raw = max / (count || 4);
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * pow).find(s => s >= raw) || pow * 10;
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 1e-6; v += step) ticks.push(Math.round(v * 100) / 100);
  return { max: top, ticks };
}
const f1 = v => Math.round(v * 10) / 10;

/* one tooltip for every chart; content is set with textContent */
function showTip(clientX, clientY, title, rows) {
  const el = document.getElementById('tip');
  if (!el) return;
  el.textContent = '';
  if (title) { const h = document.createElement('div'); h.className = 'tip-title'; h.textContent = title; el.appendChild(h); }
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'tip-row';
    if (r.color) { const k = document.createElement('span'); k.className = 'tip-key' + (r.dashed ? ' dashed' : ''); k.style.setProperty('--k', r.color); row.appendChild(k); }
    const v = document.createElement('strong'); v.textContent = r.value; row.appendChild(v);
    const l = document.createElement('span'); l.className = 'tip-label'; l.textContent = r.label; row.appendChild(l);
    el.appendChild(row);
  }
  el.hidden = false;
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = clientX + 14, top = clientY - h - 14;
  if (left + w > window.innerWidth - 8) left = clientX - w - 14;
  if (left < 8) left = 8;
  if (top < 8) top = clientY + 18;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
function hideTip() { const el = document.getElementById('tip'); if (el) el.hidden = true; }
function svgPoint(svg, ev, W) { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * (W / r.width); }
function colPath(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${f1(x)},${f1(y + h)}V${f1(y + r)}Q${f1(x)},${f1(y)} ${f1(x + r)},${f1(y)}H${f1(x + w - r)}Q${f1(x + w)},${f1(y)} ${f1(x + w)},${f1(y + r)}V${f1(y + h)}Z`;
}
function chartWidth(el) { return Math.max(260, Math.floor(el.clientWidth || el.getBoundingClientRect().width || 320)); }

/* cumulative spending this period vs last period, budget line and projection */
function paceChart(el, A) {
  const W = chartWidth(el), H = 224, m = { l: 46, r: 14, t: 18, b: 28 };
  const N = A.p.days, n = A.isCurrent ? A.dayIndex : (A.isFuture ? 0 : N);
  const prevN = Math.min(A.prevCum.length, N);
  const proj = A.isCurrent && n < N ? A.projection : 0;
  const sc = niceScale(Math.max(n ? A.cum[n - 1] : 0, prevN ? A.prevCum[prevN - 1] : 0, A.budgetTotal || 0, proj, 1) * 1.04, 4);
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = d => m.l + (N <= 1 ? 0 : (d - 1) / (N - 1) * iw);
  const y = v => m.t + ih - (v / sc.max) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Running total of spending this period compared with last period">`;
  for (const t of sc.ticks) s += `<line class="grid${t === 0 ? ' base' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(t))}" y2="${f1(y(t))}"/><text class="tick" x="${m.l - 8}" y="${f1(y(t) + 4)}" text-anchor="end">${esc(compact(t))}</text>`;
  const xd = N > 2 ? [1, Math.ceil(N / 2), N] : [1, N];
  for (const d of xd) s += `<text class="tick" x="${f1(x(d))}" y="${H - 8}" text-anchor="${d === 1 ? 'start' : d === N ? 'end' : 'middle'}">${esc(shortDate(addDays(A.p.start, d - 1)))}</text>`;
  if (A.budgetTotal) s += `<line class="ln-budget" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(A.budgetTotal))}" y2="${f1(y(A.budgetTotal))}"/><text class="lbl halo" x="${m.l + 6}" y="${f1(y(A.budgetTotal) - 7)}">Budget ${esc(compact(A.budgetTotal))}</text>`;
  if (prevN) {
    let d = '';
    for (let i = 1; i <= prevN; i++) d += (i === 1 ? 'M' : 'L') + f1(x(i)) + ',' + f1(y(A.prevCum[i - 1]));
    s += `<path class="ln-prev" d="${d}"/>`;
  }
  if (n) {
    let d = '';
    for (let i = 1; i <= n; i++) d += (i === 1 ? 'M' : 'L') + f1(x(i)) + ',' + f1(y(A.cum[i - 1]));
    s += `<path class="area-cur" d="${d}L${f1(x(n))},${f1(y(0))}L${f1(x(1))},${f1(y(0))}Z"/><path class="ln-cur" d="${d}"/>`;
  }
  const ex = n ? x(n) : 0, ey = n ? y(A.cum[n - 1]) : 0;
  let projLabel = null;
  if (proj && n) {
    s += `<path class="ln-proj" d="M${f1(ex)},${f1(ey)}L${f1(x(N))},${f1(y(proj))}"/>`;
    projLabel = { x: x(N), y: y(proj) - 9 };
    s += `<text class="lbl halo" x="${f1(projLabel.x)}" y="${f1(Math.max(12, projLabel.y))}" text-anchor="end">${esc(compact(proj))} projected</text>`;
  }
  if (n) {
    s += `<circle class="dot-ring" cx="${f1(ex)}" cy="${f1(ey)}" r="6"/><circle class="dot-cur" cx="${f1(ex)}" cy="${f1(ey)}" r="4"/>`;
    const clash = projLabel && Math.abs(projLabel.y - (ey - 12)) < 16 && Math.abs(projLabel.x - ex) < 120;
    if (!clash) s += `<text class="lbl halo strong" x="${f1(ex + (ex > W - 90 ? -10 : 10))}" y="${f1(Math.max(12, ey - 10))}" text-anchor="${ex > W - 90 ? 'end' : 'start'}">${esc(compact(A.cum[n - 1]))}</text>`;
  }
  s += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><g class="hov"></g><rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H - m.b}"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xhair'), hov = svg.querySelector('.hov');
  const move = ev => {
    const d = clamp(Math.round((svgPoint(svg, ev, W) - m.l) / iw * (N - 1)) + 1, 1, N);
    xh.setAttribute('x1', f1(x(d))); xh.setAttribute('x2', f1(x(d))); xh.setAttribute('visibility', 'visible');
    const rows = [];
    let dots = '';
    if (d <= n) { rows.push({ label: 'this period', value: money(A.cum[d - 1]), color: 'var(--series-1)' }); dots += `<circle class="dot-ring" cx="${f1(x(d))}" cy="${f1(y(A.cum[d - 1]))}" r="6"/><circle class="dot-cur" cx="${f1(x(d))}" cy="${f1(y(A.cum[d - 1]))}" r="4"/>`; }
    else if (proj) { const pv = A.cum[n - 1] + (proj - A.cum[n - 1]) * (d - n) / (N - n); rows.push({ label: 'projected', value: money(niceRound(pv)), color: 'var(--series-1)', dashed: true }); }
    if (d <= prevN) { rows.push({ label: 'last period', value: money(A.prevCum[d - 1]), color: 'var(--muted-line)' }); dots += `<circle class="dot-ring" cx="${f1(x(d))}" cy="${f1(y(A.prevCum[d - 1]))}" r="5"/><circle class="dot-prev" cx="${f1(x(d))}" cy="${f1(y(A.prevCum[d - 1]))}" r="3.5"/>`; }
    if (A.budgetTotal) rows.push({ label: 'budget', value: money(A.budgetTotal), color: 'var(--budget-line)' });
    hov.innerHTML = dots;
    showTip(ev.clientX, ev.clientY, dayLabel(addDays(A.p.start, d - 1)) + ' · day ' + d, rows);
  };
  const out = () => { xh.setAttribute('visibility', 'hidden'); hov.innerHTML = ''; hideTip(); };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', out);
}
function paceTable(A) {
  const N = A.p.days, n = A.isCurrent ? A.dayIndex : (A.isFuture ? 0 : N);
  let r = '<table class="tbl"><thead><tr><th>Day</th><th>Spent that day</th><th>Running total</th><th>Last period</th></tr></thead><tbody>';
  for (let d = 1; d <= Math.max(n, 1) && d <= N; d++) r += `<tr><td>${esc(shortDate(addDays(A.p.start, d - 1)))}</td><td>${money(A.daily[d - 1] || 0)}</td><td>${money(A.cum[d - 1] || 0)}</td><td>${d <= A.prevCum.length ? money(A.prevCum[d - 1]) : '–'}</td></tr>`;
  return r + '</tbody></table>';
}

/* six periods: spending and income side by side */
function trendChart(el, A) {
  const W = chartWidth(el), H = 214, m = { l: 46, r: 8, t: 22, b: 28 };
  const first = A.hist.findIndex(h => h.spend > 0 || h.income > 0);
  const data = A.hist.slice(Math.max(0, Math.min(first < 0 ? A.hist.length : first, A.hist.length - 3)));
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const sc = niceScale(Math.max(1, ...data.map(h => Math.max(h.spend, h.income))) * 1.08, 4);
  const y = v => m.t + ih - (v / sc.max) * ih;
  const band = iw / data.length, bw = Math.max(5, Math.min(18, band * 0.3));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Spending and income per month">`;
  for (const t of sc.ticks) s += `<line class="grid${t === 0 ? ' base' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(t))}" y2="${f1(y(t))}"/><text class="tick" x="${m.l - 8}" y="${f1(y(t) + 4)}" text-anchor="end">${esc(compact(t))}</text>`;
  data.forEach((h, i) => {
    const cx = m.l + band * (i + 0.5);
    s += colPath(cx - bw - 1, y(h.spend), bw, y(0) - y(h.spend), 4) ? `<path class="bar-s1" d="${colPath(cx - bw - 1, y(h.spend), bw, y(0) - y(h.spend), 4)}"/>` : '';
    s += colPath(cx + 1, y(h.income), bw, y(0) - y(h.income), 4) ? `<path class="bar-s3" d="${colPath(cx + 1, y(h.income), bw, y(0) - y(h.income), 4)}"/>` : '';
    s += `<text class="tick${i === data.length - 1 ? ' strong' : ''}" x="${f1(cx)}" y="${H - 8}" text-anchor="middle">${esc(periodShort(h.p))}</text>`;
  });
  data.forEach((h, i) => { s += `<rect class="hit band" data-i="${i}" x="${f1(m.l + band * i)}" y="0" width="${f1(band)}" height="${H - m.b}"/>`; });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('.band').forEach(r => {
    const i = +r.getAttribute('data-i'), h = data[i];
    const move = ev => {
      el.querySelectorAll('.band').forEach(b => b.classList.toggle('on', b === r));
      showTip(ev.clientX, ev.clientY, periodLabel(h.p), [
        { label: 'spent', value: money(h.spend), color: 'var(--series-1)' },
        { label: 'income', value: money(h.income), color: 'var(--series-3)' },
        { label: h.income - h.spend >= 0 ? 'kept' : 'overspent', value: money(Math.abs(h.income - h.spend)) }
      ]);
    };
    r.addEventListener('pointermove', move); r.addEventListener('pointerdown', move);
    r.addEventListener('pointerleave', () => { r.classList.remove('on'); hideTip(); });
  });
}
function trendTable(A) {
  let r = '<table class="tbl"><thead><tr><th>Period</th><th>Spent</th><th>Income</th><th>Kept</th></tr></thead><tbody>';
  for (const h of A.hist) r += `<tr><td>${esc(periodLabel(h.p))}</td><td>${money(h.spend)}</td><td>${money(h.income)}</td><td>${money(h.income - h.spend)}</td></tr>`;
  return r + '</tbody></table>';
}

/* average day-to-day spending per weekday */
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
function weekdayName(i, style) { return fmtDate(addDays('2026-10-04', i), { weekday: style || 'short' }); }
function weekdayChart(el, A) {
  const W = chartWidth(el), H = 176, m = { l: 8, r: 8, t: 22, b: 26 };
  const vals = WD_ORDER.map(i => A.weekday[i]);
  const max = Math.max(...vals, 0);
  const iw = W - m.l - m.r, ih = H - m.t - m.b, band = iw / 7, bw = Math.min(24, band * 0.5);
  const y = v => m.t + ih - (max > 0 ? v / max : 0) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Average day-to-day spending by weekday">`;
  s += `<line class="grid base" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(0))}" y2="${f1(y(0))}"/>`;
  const top = vals.indexOf(max);
  vals.forEach((v, i) => {
    const cx = m.l + band * (i + 0.5);

/* calendar heatmap of daily spending (sequential ramp) */
function heatmapHTML(A) {
  const off = (parseYMD(A.p.start).getDay() + 6) % 7;
  const pos = A.daily.filter(v => v > 0).sort((a, b) => a - b);
  const q = [0.2, 0.4, 0.6, 0.8].map(f => (pos.length ? pos[Math.min(pos.length - 1, Math.floor(f * pos.length))] : 0));
  const level = v => (v <= 0 ? 0 : v <= q[0] ? 1 : v <= q[1] ? 2 : v <= q[2] ? 3 : v <= q[3] ? 4 : 5);
  let h = '<div class="hm" role="grid" aria-label="Spending per day">';
  for (const i of WD_ORDER) h += `<span class="hm-h" aria-hidden="true">${esc(weekdayName(i, 'narrow'))}</span>`;
  for (let i = 0; i < off; i++) h += '<span class="hm-pad" aria-hidden="true"></span>';
  for (let d = 0; d < A.p.days; d++) {
    const date = addDays(A.p.start, d), v = A.daily[d] || 0, fut = date > A.today;
    h += `<span class="hm-c l${fut ? 'f' : level(v)}" tabindex="0" data-date="${date}" data-v="${v}" aria-label="${esc(dayLabel(date))}: ${esc(money(v))}">${+date.slice(8)}</span>`;
  }
  h += '</div><div class="scale" aria-hidden="true"><span>Less</span>';
  for (let i = 1; i <= 5; i++) h += `<i class="hm-c l${i}"></i>`;
  return h + '<span>More</span></div>';
}
function bindHeatmap(root, A) {

    const date = t.getAttribute('data-date'), v = +t.getAttribute('data-v');

    showTip(x, y, dayLabel(date), [{ label: n === 1 ? 'spent · 1 entry' : 'spent · ' + n + ' entries', value: money(v), color: 'var(--series-1)' }]);
  };
  grid.addEventListener('pointermove', ev => { const t = ev.target.closest('.hm-c'); if (t) show(t, ev.clientX, ev.clientY); else hideTip(); });
  grid.addEventListener('pointerdown', ev => { const t = ev.target.closest('.hm-c'); if (t) show(t, ev.clientX, ev.clientY); });

/* the month's plan as a flow: every income pours into one pool, which fans out into
   fixed costs, the saving goal and everyday money (a shortfall joins on the left if plans exceed income) */
let FLOW_N = 0;
function flowChart(el, A) {
  const P = A.plan;
  const solo = household().solo;
  const pc = w => (solo ? 'var(--series-3)' : 'var(--' + (w === 'p2' ? 'p2' : w === 'joint' ? 'pj' : 'p1') + ')');
  const val = r => (r.mine != null ? r.mine : r.amount);
  const left = P && P.incomes.length ? P.incomes.map(r => ({ name: r.name, sub: solo ? '' : memberName(r.who), v: val(r), color: pc(r.who), tip: [] }))
    : (P && P.incomeActual > 0 ? [{ name: 'Income so far', sub: '', v: P.incomeActual, color: 'var(--series-3)', tip: [] }] : []);
  if (!P || !left.length) { el.innerHTML = '<p class="muted">Add what comes in each month to see where it goes.</p>'; return; }
  const groups = new Map();
  for (const r of P.fixed) {
    const g = groups.get(r.cat) || { cat: r.cat, v: 0, items: [] };
    g.v += val(r); g.items.push(r); groups.set(r.cat, g);
  }
  let gl = Array.from(groups.values()).sort((a, b) => b.v - a.v);
  const base = Math.max(sum(left, l => l.v), P.fixedTotal + P.save + Math.max(0, P.flexible), 1);
  const small = gl.filter(g => g.v < base * 0.045);
  if (small.length > 1) { gl = gl.filter(g => small.indexOf(g) < 0); gl.push({ cat: '', v: sum(small, g => g.v), items: [].concat(...small.map(g => g.items)), other: true }); }
  const right = gl.map(g => ({
    name: g.other ? 'Other fixed' : g.items.length === 1 ? g.items[0].name : catById(g.cat).name,
    sub: g.items.length > 1 ? plural(g.items.length, 'item') : '',
    v: g.v, color: !g.other && catById(g.cat).group === 'savings' ? 'var(--ring3)' : 'var(--ring2)',
    tip: g.items.map(r => ({ label: r.name + (solo ? '' : ' · ' + (r.part != null && r.part < 1 ? pct(r.part) + ' of ' + compact(r.amount) : memberName(r.who))), value: moneyR(val(r)) }))
  }));
  if (P.save > 0) right.push({ name: 'Saving goal', sub: '', v: P.save, color: 'var(--ring3)', tip: [] });
  if (P.flexible > 0) right.push({ name: 'Everyday', sub: 'safe to spend', v: P.flexible, color: 'var(--ring1)', tip: [] });
  if (P.flexible < 0) left.push({ name: 'Shortfall', sub: 'plans exceed income', v: -P.flexible, color: 'var(--bad)', tip: [], short: true });

  // every node gets a slot tall enough for its two-line label; the bar sits in the middle of its slot
  const W = chartWidth(el), narrow = W < 460;
  const labW = narrow ? 94 : 136, barW = 9, poolW = 6, gap = 7, padT = 30, padB = 6, slotMin = 25;
  const total = Math.max(sum(left, n => n.v), sum(right, n => n.v));
  const k = (narrow ? 230 : 260) / total, poolH = total * k;
  const sideH = nodes => sum(nodes, n => Math.max(n.v * k, slotMin)) + gap * (nodes.length - 1);
  const inner = Math.max(poolH, sideH(left), sideH(right)), H = Math.round(inner + padT + padB);
  const xL = labW, xR = W - labW - barW, xP = Math.round((xL + barW + xR) / 2 - poolW / 2);
  const place = nodes => {
    let y = padT + (inner - sideH(nodes)) / 2, acc = 0;
    for (const n of nodes) { const s = Math.max(n.v * k, slotMin); n.h = Math.max(2, n.v * k); n.y = y + (s - n.h) / 2; n.ly = y + s / 2; n.p0 = acc; acc += n.v; y += s + gap; }
  };
  place(left); place(right);
  const poolY = padT + (inner - poolH) / 2;
  const uid = 'fl' + (++FLOW_N);
  const band = (x0, a0, b0, x1, a1, b1) => { const xm = f1((x0 + x1) / 2); return 'M' + f1(x0) + ',' + f1(a0) + 'C' + xm + ',' + f1(a0) + ' ' + xm + ',' + f1(a1) + ' ' + f1(x1) + ',' + f1(a1) + 'L' + f1(x1) + ',' + f1(b1) + 'C' + xm + ',' + f1(b1) + ' ' + xm + ',' + f1(b0) + ' ' + f1(x0) + ',' + f1(b0) + 'Z'; };
  const tips = [];
  let defs = '<defs>', links = '', nodes = '', labels = '';
  const ribbon = (n, side, i) => {
    const gid = uid + side + i, y0 = poolY + n.p0 * k, hh = n.v * k;
    const fromX = side === 'L' ? xL + barW : xP + poolW, toX = side === 'L' ? xP : xR;
    defs += '<linearGradient id="' + gid + '" gradientUnits="userSpaceOnUse" x1="' + f1(fromX) + '" x2="' + f1(toX) + '" y1="0" y2="0">' +
      '<stop offset="0" style="stop-color:' + (side === 'L' ? n.color : 'var(--ink)') + ';stop-opacity:' + (side === 'L' ? '.5' : '.1') + '"/>' +
      '<stop offset="1" style="stop-color:' + (side === 'L' ? 'var(--ink)' : n.color) + ';stop-opacity:' + (side === 'L' ? '.1' : '.5') + '"/></linearGradient>';
    const d = side === 'L' ? band(fromX, n.y, n.y + hh, toX, y0, y0 + hh) : band(fromX, y0, y0 + hh, toX, n.y, n.y + hh);
    tips.push(n);
    links += '<path class="fl-link" data-t="' + (tips.length - 1) + '" d="' + d + '" fill="url(#' + gid + ')"/>';
    const x = side === 'L' ? xL : xR;
    nodes += '<rect class="fl-node" data-t="' + (tips.length - 1) + '" x="' + f1(x) + '" y="' + f1(n.y) + '" width="' + barW + '" height="' + f1(n.h) + '" rx="3" style="fill:' + n.color + '"/>';
    const lx = side === 'L' ? xL - 8 : xR + barW + 8, anchor = side === 'L' ? 'end' : 'start';
    const maxCh = Math.floor((labW - 12) / 6.6), full = compact(n.v) + (n.sub ? ' · ' + n.sub : '');
    const nm = n.name.length > maxCh ? n.name.slice(0, maxCh - 1) + '…' : n.name;
    labels += '<text class="fl-name" x="' + f1(lx) + '" y="' + f1(n.ly - 2) + '" text-anchor="' + anchor + '">' + esc(nm) + '</text>' +
      '<text class="fl-amt" x="' + f1(lx) + '" y="' + f1(n.ly + 12) + '" text-anchor="' + anchor + '">' + esc(full.length <= Math.floor((labW - 10) / 6) ? full : compact(n.v)) + '</text>';
  };
  left.forEach((n, i) => ribbon(n, 'L', i));
  right.forEach((n, i) => ribbon(n, 'R', i));
  defs += '</defs>';
  const inTotal = sum(left.filter(n => !n.short), n => n.v);
  const cap = '<text class="fl-cap" x="' + f1(xP + poolW / 2) + '" y="' + f1(Math.max(12, poolY - 10)) + '" text-anchor="middle">' + esc(compact(inTotal)) + ' in</text>';
  const label = 'Coming in ' + money(inTotal) + ': ' + left.map(n => n.name + (n.sub ? ' (' + n.sub + ')' : '') + ' ' + money(n.v)).join(', ') + '. Going to: ' + right.map(n => n.name + ' ' + money(n.v)).join(', ') + '.';
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(label) + '">' + defs + links +
    '<rect class="fl-pool" x="' + xP + '" y="' + f1(poolY) + '" width="' + poolW + '" height="' + f1(total * k) + '" rx="3"/>' + nodes + labels + cap + '</svg>';
  const svg = el.querySelector('svg');
  const paths = Array.from(svg.querySelectorAll('.fl-link'));
  const show = (ev, i) => {
    const n = tips[i];
    paths.forEach(p => p.classList.toggle('dim', p.getAttribute('data-t') !== String(i)));
    const rows = [{ label: pct(n.v / Math.max(1, inTotal)) + ' of what comes in', value: money(n.v), color: n.color }].concat(n.tip.slice(0, 6));
    showTip(ev.clientX, ev.clientY, n.name + (n.sub && n.tip.length === 0 ? ' · ' + n.sub : ''), rows);
  };
  svg.addEventListener('pointermove', ev => { const t = ev.target.closest('[data-t]'); if (t) show(ev, +t.getAttribute('data-t')); else { paths.forEach(p => p.classList.remove('dim')); hideTip(); } });
  svg.addEventListener('pointerdown', ev => { const t = ev.target.closest('[data-t]'); if (t) show(ev, +t.getAttribute('data-t')); });
  svg.addEventListener('pointerleave', () => { paths.forEach(p => p.classList.remove('dim')); hideTip(); });
}

/* ===================== Claude: understanding entries, receipts, questions ===================== */
const AI = { fn: null, ok: false, images: false, tools: false, mediaTypes: [], maxBytes: 0, blocked: '' };

async function initAI() {
  try {
    const c = window.claude;

    const s = await c.use('sample');
    if (!s) return;
    AI.fn = s; AI.ok = true;

}

function aiErrorText(e) {

}
function catLines(cats) {
  const ex = cats.filter(c => c.type === 'expense' && !c.hidden).map(c => c.id + ' = ' + c.name).join('; ');
  const inc = cats.filter(c => c.type === 'income' && !c.hidden).map(c => c.id + ' = ' + c.name).join('; ');

}
const ENTRY_SHAPE = '{"entries":[{"type":"expense","amount":120,"category":"food","date":"2026-01-31","note":"Coffee","merchant":"Starbucks","method":"UPI","repeat":"none"}]}';
const ENTRY_RULES = [
  '- amount: a positive number in the ledger currency. Read shorthand like 25k = 25000, 1.5 lakh = 150000, 2 cr = 20000000. Never convert between currencies.',
  '- type: "income" for money received (salary, refunds, cashback, gifts received, selling something, interest), otherwise "expense".',
  '- Paying a credit card bill, moving money between own accounts, ATM withdrawals and lending money use category "transfer". SIPs, deposits and investments use "invest".',
  '- note: 1 to 5 words saying what it was, in sentence case, without the amount or the date. merchant: the shop, app or person if named, else "".',
  '- method: one of Cash, UPI, Card, Credit Card, Bank Transfer, Wallet if mentioned, else "".',

async function aiParseText(text, signal) {

    '',

async function prepareImage(file) {
  const okType = !AI.mediaTypes.length || AI.mediaTypes.indexOf(file.type) >= 0;
  const okSize = !AI.maxBytes || file.size <= AI.maxBytes;
  if (okType && okSize) return file;
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej({ code: 'image_rejected' })), 'image/jpeg', 0.88));
}
async function aiReadImage(file, signal) {
  const ctx = parseCtx();
  const img = await prepareImage(file);
  const prompt = [
    'The image is a receipt, bill, invoice, order confirmation, or a payment screenshot from a UPI, bank, card or wallet app.',
    'Extract the money that moved, for a personal finance ledger.',
    'Today is ' + ctx.today + '. Ledger currency: ' + FMT.cur + '.',
    catLines(ctx.cats),
    '',
    'Reply with only JSON in this shape: ' + ENTRY_SHAPE.slice(0, -1) + ',"currency":"INR"}',
    'Rules:',
    '- Use the final total actually paid (after tax, tip and discounts), not subtotals or single line items. A single receipt is one entry.',
    '- date: the transaction date printed on the image as YYYY-MM-DD; if none is visible, use today.',
    '- currency: the ISO code shown on the image, or "" if unclear.',
    '- A screenshot showing money received is type "income".',
    '- If no payment is visible, reply {"entries":[]}.',
    ENTRY_RULES
  ].join('\n');
  const res = await AI.fn.json(prompt, { modelTier: 'quick', images: [img], signal });
  const drafts = draftsFromAI(res, ctx);
  const cur = res && typeof res.currency === 'string' ? res.currency.toUpperCase() : '';
  return { drafts, foreign: cur && /^[A-Z]{3}$/.test(cur) && cur !== FMT.cur ? cur : '' };
}

/* ---------- questions about the ledger ---------- */
function toolQuery(input) {
  const from = isYMD(String(input.from || '')) ? String(input.from) : '0000-01-01';
  const to = isYMD(String(input.to || '')) ? String(input.to) : '9999-12-31';
  const type = input.type === 'income' || input.type === 'expense' ? input.type : '';
  const catQ = String(input.category || '').trim().toLowerCase();
  const text = String(input.text || '').trim().toLowerCase();
  const cats = allCats();
  const catIds = catQ ? cats.filter(c => c.id === catQ || c.name.toLowerCase().indexOf(catQ) >= 0).map(c => c.id) : null;
  const rows = sortedEntries().filter(e => e.date >= from && e.date <= to && (!type || e.type === type) && (!catIds || catIds.indexOf(e.cat) >= 0) &&
    (!text || (e.note + ' ' + e.merchant + ' ' + e.tags.join(' ') + ' ' + catById(e.cat, e.type).name).toLowerCase().indexOf(text) >= 0));
  const byCat = {};
  for (const e of rows) { const n = catById(e.cat, e.type).name; byCat[n] = round2((byCat[n] || 0) + e.amount); }
  const lim = clamp(parseInt(input.limit, 10) || 40, 1, 80);
  return {
    count: rows.length,
    total_spent: round2(sum(rows.filter(e => kindOf(e) === 'spend'), e => e.amount)),
    total_income: round2(sum(rows.filter(e => e.type === 'income'), e => e.amount)),
    total_invested: round2(sum(rows.filter(e => kindOf(e) === 'invest'), e => e.amount)),
    by_category: byCat,
    entries: rows.slice(0, lim).map(e => ({ date: e.date, type: e.type, amount: e.amount, category: catById(e.cat, e.type).name, note: e.note, merchant: e.merchant, method: e.method }))
  };
}
function toolPeriods(input) {
  const n = clamp(parseInt(input.count, 10) || 6, 1, 24);
  const sd = settings().startDay, key = periodKeyFor(todayStr(), sd), list = sortedEntries();
  const out = [];
  for (let k = n - 1; k >= 0; k--) {
    const p = periodFromKey(shiftKey(key, -k), sd), s = periodStats(p, list);
    const top = Array.from(s.byCat.entries()).filter(([, v]) => v.kind === 'spend').sort((a, b) => b[1].total - a[1].total).slice(0, 5).map(([id, v]) => catById(id).name + ' ' + round2(v.total));
    out.push({ start: p.start, end: p.end, spent: round2(s.spend), income: round2(s.income), invested: round2(s.invest), top_categories: top });
  }
  return out;
}
const ASK_TOOLS = [
  { name: 'query_entries', description: 'Search the ledger. Returns matching entry count, totals (spent, income, invested), totals by category, and up to `limit` entries newest first. All filters are optional.',
    inputSchema: { type: 'object', properties: { from: { type: 'string', description: 'YYYY-MM-DD inclusive' }, to: { type: 'string', description: 'YYYY-MM-DD inclusive' }, type: { type: 'string', enum: ['expense', 'income'] }, category: { type: 'string', description: 'category id or name' }, text: { type: 'string', description: 'words to find in the note, merchant or tags' }, limit: { type: 'number' } } },
    execute: toolQuery },
  { name: 'period_totals', description: 'Totals per budget period (month) for the most recent `count` periods: spent, income, invested and the top spending categories.',
    inputSchema: { type: 'object', properties: { count: { type: 'number' } } },
    execute: toolPeriods }
];
function askPrimer(A) {
  return [
    'You are the money analyst inside Pocket Ledger, a personal finance tracker. The person asking owns this data.',
    'Answer using the summary below and, when you need detail, the tools. Use exact numbers from the data; format money in ' + FMT.cur + ' like ' + money(1234.5) + '.',
    'Keep answers short: two to six sentences, or a few bullet points. When you suggest something, base it on their real numbers. If the data can’t answer, say what they would need to log. Never invent entries.',
    'Spending excludes investments and transfers such as card bill payments and ATM withdrawals.',
    '',
    'Ledger summary:',

}
async function aiAsk(turns, A, onText, signal) {

/* light markdown → safe HTML for answers */
function mdLite(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  let html = '', list = '';
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>');
  const close = () => { if (list) { html += '</' + list + '>'; list = ''; } };
  for (const raw of lines) {
    const l = raw.trim();
    let m;
    if (!l) { close(); continue; }
    if ((m = /^[-•*]\s+(.*)$/.exec(l))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if ((m = /^\d+[.)]\s+(.*)$/.exec(l))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    close();
    if ((m = /^#{1,4}\s+(.*)$/.exec(l))) { html += '<p><strong>' + inline(m[1]) + '</strong></p>'; continue; }
    html += '<p>' + inline(l) + '</p>';
  }
  close();
  return html;
}

function runCountUps() {
  for (const el of $$('[data-count]')) {
    const to = +el.dataset.count, key = el.dataset.key || 'n';
    const had = UI.counted.has(key), from = had ? UI.counted.get(key) : to;
    UI.counted.set(key, to);
    if (!had || from === to || reducedMotion()) continue;
    const sign = el.dataset.sign || '';
    const t0 = performance.now(), D = 700;
    const step = now => {
      const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);

    requestAnimationFrame(step);
  }
}

  UI.ringsDone = true;
  for (const r of rings) { r.style.transition = 'none'; r.setAttribute('stroke-dashoffset', r.dataset.c); }

function matchQuery(e, q) {
  if (/^[\d.,₹$€£\s]+$/.test(q)) {
    const n = parseFloat(q.replace(/[^\d.]/g, ''));
    if (n > 0) return Math.abs(e.amount - n) < 0.005 || String(e.amount).indexOf(String(n)) === 0;
  }
  const hay = (e.note + ' ' + e.merchant + ' ' + e.method + ' ' + catById(e.cat, e.type).name + ' ' + memberName(whoOf(e)) + ' ' + memberName(payerOf(e)) + ' ' + e.tags.map(t => '#' + t).join(' ')).toLowerCase();
  return q.split(/\s+/).every(w => hay.indexOf(w) >= 0);
}
function activityList() {
  const q = UI.act.q.trim().toLowerCase();
  let list = sortedEntries();
  if (!q) { const p = periodFromKey(UI.period, settings().startDay); list = list.filter(e => e.date >= p.start && e.date <= p.end); }
  if (UI.person === 'joint') list = list.filter(e => whoOf(e) === 'joint');
  else if (UI.person !== 'all') { const r = shareRatio(); list = list.filter(e => shareOf(e, UI.person, r) > 0 || payerOf(e) === UI.person); }
  if (UI.act.type !== 'all') list = list.filter(e => e.type === UI.act.type);
  if (UI.act.cat) list = list.filter(e => e.cat === UI.act.cat);
  if (q) list = list.filter(e => matchQuery(e, q));
  return list;
}

async function askSubmit(q) {

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg, actions, ms) {
  if (!msg) return;
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast glass';
  el.setAttribute('role', 'status');
  const t = document.createElement('span');
  t.textContent = msg;
  el.appendChild(t);
  const done = () => { clearTimeout(toastTimer); if (el.parentNode) el.parentNode.removeChild(el); };
  for (const a of actions || []) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = a.label;
    b.addEventListener('click', () => { done(); a.run(); });
    el.appendChild(b);
  }
  root.textContent = '';
  root.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(done, ms || 4200);
}

  let drafts = r.entries.map((d, i) => (UI.slipOver[i] ? Object.assign({}, d, UI.slipOver[i]) : d));
  if (aiReady() && (r.needsAI || drafts.some(d => !d.amount))) {
    UI.busy = true;
    renderSlips();
    UI.aiCtl = new AbortController();
    try {
      const ai = await aiParseText(text, UI.aiCtl.signal);
      if (ai.length) {
        ai.forEach((a, i) => {
          const same = ai.length === drafts.length, o = same ? UI.slipOver[i] : null;
          if (o && o.cat) { a.cat = o.cat; a.type = catById(o.cat).type; a.catLocked = true; }
          if (same) { a.tags = drafts[i].tags || []; a.who = (o && o.who) || drafts[i].who || a.who || ''; a.paid = (o && o.paid) || drafts[i].paid || a.paid || ''; }
        });
        drafts = ai;
      }
    } catch (e) {
      aiNoteError(e);
      if (e && e.code !== 'cancelled' && !drafts.some(d => d.amount)) toast(aiErrorText(e));
    } finally {
      UI.busy = false;
      UI.aiCtl = null;
    }
  }
  drafts = drafts.filter(d => d.amount > 0);
  if (!drafts.length) { renderSlips(); nudge('I couldn’t find an amount. Try something like “' + exampleTry()[0] + '”.'); return; }
  if (el.value.trim() === text) { el.value = ''; UI.draft = null; UI.slipOver = {}; autosize(); syncDockButtons(); }
  renderSlips();
  const src = source || (r.source === 'sms' ? 'sms' : 'text');
  await saveDrafts(drafts.map(d => Object.assign({}, d, { source: src })), src);
  doneTyping();
}
/* on phones, put the keyboard away after a save so the result and the tabs are in view */

/* ---------- voice ---------- */
const Voice = { on: false, rec: null, failed: false, supported: typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition) };
function setMicUI(on) {
  const b = $('#mic-btn');
  b.classList.toggle('listening', on);
  b.innerHTML = on ? ICON.stop : ICON.mic;
  b.setAttribute('aria-label', on ? 'Stop listening' : 'Speak an entry');
  syncDockButtons();
}
function dictationCoach(msg) {
  setCapOpen(true);
  const el = $('#entry');
  el.focus();
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const mac = /Mac/i.test(navigator.platform || navigator.userAgent || '');
  const how = coarse ? 'tap the microphone on your keyboard and speak' : mac ? 'press the Globe key or Fn twice and speak' : 'press Windows + H and speak';
  const text = msg || (IN_CLAUDE ? 'Claude doesn’t let pages use the microphone, so ' + how + ' instead. It fills this box the same way.' : 'Voice isn’t available in this browser, so ' + how + ' instead.');
  const c = $('#coach');
  c.innerHTML = ic('mic') + '<span>' + esc(text) + '</span>';
  c.hidden = false;
  updateDockHeight();
  clearTimeout(nudge.t);
  nudge.t = setTimeout(hideCoach, 10000);
}
function toggleVoice() {
  if (Voice.on) { try { Voice.rec.stop(); } catch (e) { /* ignore */ } return; }
  if (!Voice.supported || Voice.failed) { dictationCoach(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec;
  try { rec = new SR(); } catch (e) { Voice.failed = true; dictationCoach(); return; }
  rec.lang = Voice.lang || (FMT.cur === 'INR' ? 'en-IN' : (navigator.language || 'en-US'));
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = '', heard = false;
  const el = $('#entry');
  const before = el.value.trim();
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    heard = true;
    el.value = (before ? before + ' ' : '') + (finalText + ' ' + interim).trim();
    onEntryInput();
  };
  rec.onerror = ev => {
    const er = ev.error;
    if (er === 'not-allowed' || er === 'service-not-allowed') {
      if (IN_CLAUDE) { Voice.failed = true; dictationCoach(); }
      else nudge('The microphone is blocked for this site. Allow it in your browser’s site settings, then tap the mic again.');
    } else if (er === 'audio-capture') nudge('No microphone found. Check that one is connected and not busy in another app.');
    else if (er === 'network') nudge('Voice typing needs an internet connection. Try again when you’re online.');
    else if (er === 'language-not-supported') { Voice.lang = 'en-US'; nudge('Switched voice to US English. Tap the mic again.'); }
    else if (er === 'no-speech') nudge('I didn’t hear anything. Tap the mic and try again.');
  };
  rec.onend = () => {
    Voice.on = false; Voice.rec = null; setMicUI(false);
    if (heard && finalText.trim()) { onEntryInput(); if (settings().voiceAuto) setTimeout(() => submitEntry('voice'), 120); }
    else maybeCloseCap();
  };
  try { rec.start(); Voice.on = true; Voice.rec = rec; setCapOpen(true); setMicUI(true); hideCoach(); }
  catch (e) { Voice.failed = true; dictationCoach(); }
}

/* ===================== actions: saving, learning, repeating, examples ===================== */
function storeErrorText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Storage is full. Download a backup, then delete old entries to make room.';
  if (c === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  if (c === 'read_only' || c === 'revoked') return 'This ledger is read-only right now. Reload the page to continue.';
  if (c === 'invalid_argument') return 'That change couldn’t be saved. Reload the page and try again.';
  if (c === 'permission_denied' || c === 'not_granted') return 'You can look at this ledger but not change it. Ask its owner to give you Can edit.';
  return 'Couldn’t save that. Check your connection and try again.';
}
function ensureSettingsSaved() {
  if (Store.meta.settings || !Store.metaLoaded) return;
  saveSettings({}).catch(() => {});
}
async function saveSettings(patch) {
  await metaReady();
  const cur = Object.assign({}, Store.meta.settings || {});
  delete cur.rev;
  const s = settings();
  const next = Object.assign({ currency: s.currency, startDay: s.startDay, ai: s.ai, voiceAuto: s.voiceAuto, dateOrder: s.dateOrder }, cur, patch);
  await putMeta('settings', next);
}
async function saveBudgets(b) {
  await metaReady();
  const cats = {};
  for (const k in (b.cats || {})) if (+b.cats[k] > 0) cats[k] = round2(+b.cats[k]);
  await putMeta('budgets', { total: +b.total > 0 ? round2(+b.total) : 0, cats, sample: !!b.sample });
}
function recurringRaw() { return Object.assign({}, (Store.meta.recurring && Store.meta.recurring.items) || {}); }
async function saveRecurring(list) {
  await metaReady();
  const items = recurringRaw();
  for (const r of list) items[r.id] = r;
  await putMeta('recurring', { items });
}
async function removeRecurring(ids) {
  await metaReady();
  const items = recurringRaw();
  for (const id of ids) delete items[id];
  await putMeta('recurring', { items });
}
function makeRule(d) {
  const day = +d.date.slice(8);
  return { id: uid('r'), every: d.repeat, day, start: d.date, next: nextOccurrence(d.date, d.repeat, day), active: true,
    tpl: { type: d.type, amount: d.amount, cat: d.cat, note: d.note, merchant: d.merchant || '', method: d.method || '', tags: d.tags || [], who: entryPeople(d).who, paid: entryPeople(d).paid } };
}
let materializing = false;
async function materializeRecurring() {
  if (materializing || !Store.ready || Store.readOnly) return;
  materializing = true;
  try {
    const items = recurringItems(), today = todayStr(), now = Date.now();
    const out = [], changed = [];
    for (const id in items) {
      const r = items[id];
      if (!r.active) continue;
      let next = r.next, n = 0;
      while (next <= today && n < 60) {
        const eid = 'r-' + r.id + '-' + next;
        if (!Store.entries.has(eid)) out.push(normEntry(eid, Object.assign({}, r.tpl, { date: next, source: 'recurring', rec: r.id, created: now + n, updated: now + n })));
        next = nextOccurrence(next, r.every, r.day);
        n++;
      }
      if (next !== r.next) changed.push(Object.assign({}, r, { next }));
    }
    if (out.length) await putEntries(out);
    if (changed.length) await saveRecurring(changed);
    if (out.length) toast('Added ' + plural(out.length, 'repeating entry', 'repeating entries') + ' that came due');
  } catch (e) { /* tried again on the next visit */ }
  finally { materializing = false; }
}

/* learned shortcuts: "starbucks" → food */
const RULE_STOP = /^(?:paid|bill|bills|payment|online|order|expense|misc|other|money|cash|upi|card|transfer|entry|bank debit|bank credit|from|to|the)$/;
function ruleKeyFor(e) {
  const src = (e.merchant || '').trim() || e.note || '';
  let k = normText(src).trim().replace(/\b(?:at|from|to|for|on|in|the|a|an|my|with|and|of)\b/g, ' ').replace(/[\d§]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!e.merchant) k = k.split(' ').filter(w => w.length > 1).slice(0, 2).join(' ');
  if (!k || k.length < 3 || RULE_STOP.test(k)) return '';
  return k.slice(0, 40);
}
async function learnRules(pairs) {
  await metaReady();
  const map = Object.assign({}, rulesMap());
  for (const [k, c] of pairs) if (k) map[k] = c;
  const keys = Object.keys(map);
  if (keys.length > 500) for (const k of keys.slice(0, keys.length - 500)) delete map[k];
  await putMeta('rules', { map });
}

async function saveDrafts(drafts, source, quiet) {
  const now = Date.now();
  const entries = [], rules = [], recs = [];
  drafts.forEach((d, i) => {
    let rec = '';
    if (d.repeat) { const r = makeRule(d); recs.push(r); rec = r.id; }
    const pp = entryPeople(d);
    const e = normEntry(uid('t'), Object.assign({}, d, { who: pp.who, paid: pp.paid, by: d.by || meId(), source: d.source || source || 'text', rec, created: now + i, updated: now + i, sample: false }));
    entries.push(e);
    if (d.catLocked) { const k = ruleKeyFor(e); if (k) rules.push([k, e.cat]); }
  });
  try {
    await putEntries(entries);
    if (recs.length) await saveRecurring(recs);
    if (rules.length) await learnRules(rules);
    ensureSettingsSaved();
  } catch (e) { toast(storeErrorText(e)); return []; }
  flashIds(entries.map(e => e.id));
  if (!IN_CLAUDE && Store.mode === 'device' && navigator.storage && navigator.storage.persist && !uiFlag('persist-asked')) { uiFlag('persist-asked', true); navigator.storage.persist().catch(() => {}); }
  const sd = settings().startDay;
  const otherPeriod = entries.length && periodKeyFor(entries[0].date, sd) !== UI.period;
  if (!quiet) {
    const label = entries.length === 1 ? addedLabel(entries[0]) : 'Added ' + entries.length + ' entries';
    UI.undo = async () => {
      try { await deleteEntries(entries.map(e => e.id)); if (recs.length) await removeRecurring(recs.map(r => r.id)); toast('Removed'); }
      catch (e) { toast(storeErrorText(e)); }
    };
    const acts = [{ label: 'Undo', run: () => UI.undo && UI.undo() }];
    if (entries.length === 1) acts.push({ label: 'Edit', run: () => { const e = Store.entries.get(entries[0].id); if (e) openEditor(e); } });
    else if (otherPeriod) acts.push({ label: 'Show', run: () => { UI.period = periodKeyFor(entries[0].date, sd); UI.periodTouched = true; setTab('activity'); } });
    toast(label + (otherPeriod && entries.length === 1 ? ' · ' + dayLabel(entries[0].date) : ''), acts, 6500);
  }
  return entries;
}
function addedLabel(e) {
  const c = catById(e.cat, e.type), k = kindOf(e);
  return (e.type === 'income' ? 'Added income ' : 'Added ') + money(e.amount) + ' · ' + c.name + (k === 'invest' ? ' (saving)' : k === 'transfer' ? ' (not spending)' : '');
}
async function updateEntry(prev, next) {
  const e = normEntry(prev.id, Object.assign({}, prev, next, { updated: Math.max(Date.now(), prev.updated + 1) }));
  try { await putEntries([e]); } catch (err) { toast(storeErrorText(err)); return null; }
  flashIds([e.id]);
  if (e.cat !== prev.cat) {
    const key = ruleKeyFor(e);
    if (key) {
      learnRules([[key, e.cat]]).catch(() => {});
      const similar = Array.from(Store.entries.values()).filter(x => x.id !== e.id && x.cat === prev.cat && x.type === e.type && ruleKeyFor(x) === key);
      if (similar.length) {
        toast('Saved. I’ll file “' + key + '” under ' + catById(e.cat).name + ' from now on.', [{ label: 'Move ' + similar.length + ' more', run: async () => {
          try { await putEntries(similar.map(x => normEntry(x.id, Object.assign({}, x, { cat: e.cat, updated: Date.now() })))); toast('Moved ' + plural(similar.length, 'entry', 'entries')); }
          catch (err) { toast(storeErrorText(err)); }
        } }], 8000);
        return e;
      }
      toast('Saved. I’ll file “' + key + '” under ' + catById(e.cat).name + ' from now on.');
      return e;
    }
  }
  toast('Saved');
  return e;
}
async function removeEntry(e) {
  try {
    await deleteEntries([e.id]);
    if (/^p-/.test(e.id) && e.plan) { const p = planRaw(); if (p.skipped.indexOf(e.id) < 0) { p.skipped.push(e.id); await savePlan(p); } }
  } catch (err) { toast(storeErrorText(err)); return; }
  toast('Deleted ' + e.note, [{ label: 'Undo', run: async () => { try { await putEntries([normEntry(e.id, Object.assign({}, e, { updated: Date.now() }))]); } catch (err) { toast(storeErrorText(err)); } } }], 6500);
}

/* the monthly plan: incomes, fixed costs, saving goal */
function planRaw() {
  const p = Store.meta.plan || {}, g = getPlan();
  return { incomes: Array.isArray(p.incomes) ? p.incomes.slice() : [], fixed: Array.isArray(p.fixed) ? p.fixed.slice() : [], save: { p1: g.saveBy.p1, p2: g.saveBy.p2 }, sample: !!p.sample, skipped: Array.isArray(p.skipped) ? p.skipped.slice(-60) : [] };
}
function cleanPlanItem(x) {
  return { id: String(x.id).slice(0, 40), name: String(x.name || '').slice(0, 60), who: x.who === 'p1' || x.who === 'p2' || x.who === 'joint' ? x.who : 'joint', cat: String(x.cat || 'other'), amount: round2(+x.amount || 0), day: clamp(parseInt(x.day, 10) || 1, 1, 31), auto: !!x.auto };
}
async function savePlan(p) {
  await metaReady();
  const sv = p.save && typeof p.save === 'object' ? p.save : { p1: +p.save || 0, p2: 0 };
  const pos = v => (+v > 0 ? round2(+v) : 0);
  await putMeta('plan', { incomes: (p.incomes || []).map(cleanPlanItem), fixed: (p.fixed || []).map(cleanPlanItem), save: { p1: pos(sv.p1), p2: pos(sv.p2) }, sample: !!p.sample, skipped: (p.skipped || []).slice(-60) });
}
async function upsertPlanItem(d) {
  const p = planRaw(), key = d.kind === 'income' ? 'incomes' : 'fixed', other = key === 'incomes' ? 'fixed' : 'incomes';
  p[other] = p[other].filter(x => x.id !== d.id);
  const i = p[key].findIndex(x => x.id === d.id);
  if (i >= 0) p[key][i] = d; else p[key].push(d);
  p.sample = false;
  await savePlan(p);
}
async function removePlanItem(id) {
  const p = planRaw();
  p.incomes = p.incomes.filter(x => x.id !== id);
  p.fixed = p.fixed.filter(x => x.id !== id);
  await savePlan(p);
}
async function setPlanSave(goals) { const p = planRaw(); Object.assign(p.save, goals); p.sample = false; await savePlan(p); }
/* "Paid" / "Received": logs what is still due as an entry tied to the plan line, paid by whoever taps it unless told */
async function planPay(arg) {
  const [id, payer] = String(arg).split('|');
  const A = analyze(UI.period, 'all'), P = A.plan;
  const r = P && P.rows.find(x => x.id === id);
  if (!r || r.state === 'done') return;
  const date = A.isCurrent ? todayStr() : (r.due <= A.p.end ? r.due : A.p.end);
  const paid = payer === 'p1' || payer === 'p2' ? payer : (r.who === 'p1' || r.who === 'p2' ? r.who : meId());
  closeSheet(true);
  await saveDrafts([{ type: r.kind === 'income' ? 'income' : 'expense', amount: round2(r.amount - r.paid), cat: r.cat, note: r.name, who: r.who, paid, plan: r.id, date, merchant: '', method: '', tags: [], repeat: '' }], 'plan');
}
/* settling up: the one who owes pays the other back; it moves the balance, never the spending totals */
async function recordSettle(amount, from, to) {
  if (!(amount > 0) || from === to) return;
  const saved = await saveDrafts([{ type: 'expense', amount: round2(amount), cat: 'settle', note: 'Settled up', who: to, paid: from, method: 'UPI', merchant: '', tags: [], repeat: '', date: todayStr() }], 'manual', true);
  if (saved.length) toast(memberName(from) + ' paid ' + memberName(to) + ' back ' + money(amount), [{ label: 'Undo', run: async () => { try { await deleteEntries(saved.map(e => e.id)); } catch (e) { toast(storeErrorText(e)); } } }], 6500);
}
/* plan lines marked "logs itself" are added on their day, once per month */
let materializingPlan = false;
async function materializePlan() {
  if (materializingPlan || !Store.ready || Store.readOnly) return;
  const plan = getPlan();
  if (!plan.exists || plan.sample || !plan.incomes.concat(plan.fixed).some(x => x.auto)) return;
  materializingPlan = true;
  try {
    const key = currentKey(), P = analyze(key, 'all').plan, today = todayStr(), skipped = planRaw().skipped, now = Date.now(), out = [];
    if (!P) return;
    for (const r of P.rows) {
      if (!r.auto || r.state === 'done' || r.state === 'partial' || r.due > today) continue;
      const id = 'p-' + r.id + '-' + key;
      if (Store.entries.has(id) || skipped.indexOf(id) >= 0) continue;
      out.push(normEntry(id, { type: r.kind === 'income' ? 'income' : 'expense', amount: r.amount, cat: r.cat, note: r.name, who: r.who, paid: r.who === 'p2' ? 'p2' : 'p1', plan: r.id, date: r.due, source: 'plan', created: now + out.length, updated: now + out.length }));
    }
    if (out.length) { await putEntries(out); toast('Logged ' + plural(out.length, 'planned item') + ' that came due'); }
  } catch (e) { /* tried again on the next visit */ }
  finally { materializingPlan = false; }

function evalAmount(s) {
  let t = String(s || '').replace(/[,\s₹$€£¥]/g, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
  t = t.replace(/(\d+(?:\.\d+)?)k/gi, '($1*1000)').replace(/(\d+(?:\.\d+)?)(?:lakhs?|lacs?|l)/gi, '($1*100000)');
  if (!t) return 0;
  if (!/^[\d.+\-*/()]+$/.test(t)) return parseFloat(t) || 0;

  const peek = () => t[i];
  const num = () => { const st = i; while (i < t.length && /[\d.]/.test(t[i])) i++; return parseFloat(t.slice(st, i)); };
  const factor = () => { if (peek() === '(') { i++; const v = expr(); if (peek() === ')') i++; return v; } if (peek() === '-') { i++; return -factor(); } return num(); };
  const term = () => { let v = factor(); while (peek() === '*' || peek() === '/') { const op = t[i++]; const r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const op = t[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; }
  const v = expr();
  return Number.isFinite(v) && v > 0 ? round2(v) : 0;
}

function rerunCSV(positiveIsExpense) {

async function readBackupFile(file) {
  let obj = null;
  try { obj = JSON.parse(await file.text()); } catch (e) { obj = null; }
  if (!obj || obj.app !== 'pocket-ledger' || !Array.isArray(obj.entries)) { IMP.backup = { error: 'That file isn’t a Pocket Ledger backup.' }; renderImport(); return; }
  const fresh = obj.entries.filter(x => x && typeof x.id === 'string' && /^[\w.~:@+-]{1,120}$/.test(x.id) && !Store.entries.has(x.id));
  IMP.backup = { obj, fresh, total: obj.entries.length, withMeta: !Store.entries.size };
  renderImport();
}
async function importSave() {
  const ds = IMP.drafts.filter((d, i) => IMP.picked[i]);
  if (!ds.length) return;
  const src = IMP.source || 'import';
  closeSheet(true);
  const saved = await saveDrafts(ds.map(d => Object.assign({}, d, { repeat: '', source: d.source || src })), src, true);
  if (saved.length) toast('Added ' + plural(saved.length, 'entry', 'entries'), [{ label: 'Undo', run: async () => { try { await deleteEntries(saved.map(e => e.id)); toast('Removed'); } catch (e) { toast(storeErrorText(e)); } } }], 7000);
}
async function restoreBackup() {
  const b = IMP.backup;
  if (!b || b.error) return;
  const list = b.fresh.map(x => normEntry(x.id, x));
  try {
    if (list.length) await putEntries(list);
    if (b.withMeta) for (const n of META_NAMES) if (b.obj[n] && typeof b.obj[n] === 'object') { const d = Object.assign({}, b.obj[n]); delete d.rev; await putMeta(n, d); }
  } catch (e) { toast(storeErrorText(e)); return; }
  closeSheet(true);
  toast('Restored ' + plural(list.length, 'entry', 'entries'));
}

async function deleteCat(id) {

  const moved = Array.from(Store.entries.values()).filter(e => e.cat === id).map(e => normEntry(e.id, Object.assign({}, e, { cat: fallback, updated: Date.now() })));
  const items = Object.assign({}, (Store.meta.categories && Store.meta.categories.items) || {});
  delete items[id];
  const map = Object.assign({}, rulesMap());
  let rulesChanged = false;
  for (const k in map) if (map[k] === id) { delete map[k]; rulesChanged = true; }
  const b = budgets();
  try {
    if (moved.length) await putEntries(moved);
    await putMeta('categories', { items });
    if (rulesChanged) await putMeta('rules', { map });
    if (b.cats[id]) { delete b.cats[id]; await saveBudgets(b); }
  } catch (e) { toast(storeErrorText(e)); return; }
  openCategories();
  toast('Deleted “' + c.name + '”' + (moved.length ? '. ' + plural(moved.length, 'entry', 'entries') + ' moved to ' + catById(fallback).name : ''));
}

/* fill the plan in from what already repeats in the ledger */
let PS = { items: [], save: 0 };
function planSuggestions() {
  const plan = getPlan(), today = todayStr(), since = addDays(today, -95);
  const have = plan.incomes.concat(plan.fixed);
  const groups = new Map(), months = new Set();
  for (const e of sortedEntries()) {
    if (e.date > today) continue;
    if (e.date < since) break;
    months.add(e.date.slice(0, 7));
    const income = e.type === 'income';
    const fixed = !income && (FIXED.has(e.cat) || catById(e.cat, e.type).group === 'savings' || !!e.rec);
    if ((!income && !fixed) || (income && /^(refund|gift_in|other_in)$/.test(e.cat))) continue;
    const name = (!income && e.merchant ? e.merchant : e.note) || catById(e.cat, e.type).name;
    const key = (income ? 'i' : 'f') + '|' + e.cat + '|' + whoOf(e) + '|' + (ruleKeyFor(e) || normText(name).trim());
    const g = groups.get(key) || { income, cat: e.cat, who: whoOf(e), names: new Map(), amts: [], days: [], months: new Set() };
    g.names.set(name, (g.names.get(name) || 0) + 1); g.amts.push(e.amount); g.days.push(+e.date.slice(8)); g.months.add(e.date.slice(0, 7));
    groups.set(key, g);
  }
  const out = [];
  const known = x => have.concat(out).some(h => h.cat === x.cat && h.who === x.who && Math.abs(h.amount - x.amount) / Math.max(1, x.amount) < 0.25);
  for (const g of groups.values()) {
    if (g.months.size < Math.min(2, months.size)) continue;
    const med = median(g.amts);
    const steady = g.amts.every(a => Math.abs(a - med) <= med * 0.02);
    const amount = steady ? round2(med) : niceRound(med * 1.05);
    const name = cap1(Array.from(g.names.entries()).sort((a, b) => b[1] - a[1])[0][0]).slice(0, 60);
    const x = { kind: g.income ? 'income' : 'fixed', name, cat: g.cat, who: g.who, amount, day: clamp(Math.round(median(g.days)), 1, 31), auto: false };
    if (amount > 0 && !known(x)) out.push(x);
  }
  for (const r of Object.values(recurringItems())) {
    if (!r.active || r.every !== 'monthly') continue;
    const t = r.tpl, x = { kind: t.type === 'income' ? 'income' : 'fixed', name: String(t.note || '').slice(0, 60) || catById(t.cat, t.type).name, cat: t.cat, who: whoOf(t), amount: round2(+t.amount || 0), day: clamp(r.day || 1, 1, 31), auto: false };
    if (x.amount > 0 && !known(x)) out.push(x);
  }
  out.sort((a, b) => (a.kind === b.kind ? b.amount - a.amount : a.kind === 'income' ? -1 : 1));
  const r = shareRatio(), incs = plan.incomes.concat(out.filter(x => x.kind === 'income'));
  const incomeOf = w => sum(incs.filter(x => x.who === w), x => x.amount) + sum(incs.filter(x => x.who === 'joint'), x => x.amount * (w === 'p1' ? r : 1 - r));
  const save = { p1: !plan.saveBy.p1 && incomeOf('p1') > 0 ? niceRound(incomeOf('p1') * 0.2) : 0, p2: !household().solo && !plan.saveBy.p2 && incomeOf('p2') > 0 ? niceRound(incomeOf('p2') * 0.2) : 0 };
  return { items: out.slice(0, 16), save };
}

  if (text.split(/\n/).filter(l => l.trim()).length >= 3 && looksLikeBankMessage(text)) { ev.preventDefault(); openImport('sms', text); }
}
function onKey(ev) {
  if (ev.key === 'Escape') {
    if (SHEET.open) { ev.preventDefault(); closeSheet(); return; }
    if (Voice.on) { ev.preventDefault(); toggleVoice(); return; }
    hideTip(); hideCoach();
  }
  if (ev.key === 'Tab' && SHEET.open) {
    const sheet = $('#sheet-root .sheet');
    const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', sheet).filter(x => !x.disabled && !x.hidden && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!sheet.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
    else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    return;
  }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (ev.key === '/' && !SHEET.open && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) { ev.preventDefault(); $('#entry').focus(); }
}
function rotatePlaceholder() {
  const el = $('#entry');
  let i = 0;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) setInterval(() => { if (UI.capOpen && !el.value && document.activeElement !== el && !document.hidden) { const ex = exampleTry(); el.placeholder = 'Try “' + ex[++i % ex.length] + '”'; } }, 4500);
}
function bindChrome() {
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const fn = ACT[t.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    fn(t.dataset.arg != null ? t.dataset.arg : '', t, ev);
  });
  for (const b of $$('.tabs [data-tab]')) b.addEventListener('click', () => setTab(b.dataset.tab));
  const top = $('#top');
  const onScroll = () => { const s = window.scrollY > 6; if (top.classList.contains('scrolled') !== s) { top.classList.toggle('scrolled', s); } };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
    document.addEventListener('pointermove', ev => {
      const g = ev.target && ev.target.closest && ev.target.closest('button.glass, .hero');
      if (!g) return;
      const r = g.getBoundingClientRect();
      g.style.setProperty('--mx', Math.round(ev.clientX - r.left) + 'px');
      g.style.setProperty('--my', Math.round(ev.clientY - r.top) + 'px');
    }, { passive: true });
  }
  $('#prev-period').addEventListener('click', () => shiftPeriod(-1));
  $('#next-period').addEventListener('click', () => shiftPeriod(1));
  $('#period-label').addEventListener('click', () => { UI.period = currentKey(); UI.periodTouched = false; render(); });
  $('#open-settings').addEventListener('click', () => openSettings());
  $('#add-btn').addEventListener('click', () => openAddHub());
  $('#mic-btn').addEventListener('click', () => toggleVoice());
  $('#capture').addEventListener('submit', ev => { ev.preventDefault(); submitEntry(); });
  const entry = $('#entry');
  entry.addEventListener('input', onEntryInput);
  entry.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); submitEntry(); }
    else if (ev.key === 'Escape') { if (UI.aiCtl) UI.aiCtl.abort(); else if (!entry.value.trim()) entry.blur(); }
  });
  entry.addEventListener('paste', onPaste);
  entry.addEventListener('focus', () => setCapOpen(true));
  entry.addEventListener('blur', () => setTimeout(maybeCloseCap, 160));
  document.addEventListener('paste', ev => {
    const tag = (ev.target && ev.target.tagName) || '';
    if (/^(INPUT|TEXTAREA)$/.test(tag) || SHEET.open) return;
    const img = Array.from((ev.clipboardData && ev.clipboardData.files) || []).find(f => /^image\//.test(f.type));
    if (img) { ev.preventDefault(); handleImage(img); }
  });
  $('#file-img').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) handleImage(f); });
  $('#file-csv').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f) return; if (!SHEET.open || !$('#imp-body')) openImport('csv'); IMP.tab = 'csv'; readCSVFile(f); });
  $('#file-json').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f) return; if (!SHEET.open || !$('#imp-body')) openImport('backup'); IMP.tab = 'backup'; readBackupFile(f); });
  document.addEventListener('dragover', ev => { if (ev.dataTransfer && Array.from(ev.dataTransfer.types || []).indexOf('Files') >= 0) ev.preventDefault(); });
  document.addEventListener('drop', ev => {
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    ev.preventDefault();
    if (/^image\//.test(f.type)) handleImage(f);
    else if (/\.json$/i.test(f.name)) { openImport('backup'); readBackupFile(f); }
    else if (/\.(csv|txt)$/i.test(f.name) || /csv|text\/plain/.test(f.type)) { openImport('csv'); readCSVFile(f); }
    else toast('Drop a receipt photo, a CSV statement or a backup file');
  });
  document.addEventListener('keydown', onKey);
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); INSTALL_EVT = ev; });
  window.addEventListener('appinstalled', () => { INSTALL_EVT = null; });
  window.addEventListener('hashchange', () => { const h = tabFromHash(location.hash); if (h && h !== UI.tab) setTab(h); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Store.ready) { materializeRecurring(); materializePlan(); render(); } });
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('pointerdown', ev => { if (!ev.target.closest('.chart, .hm')) hideTip(); });
  if (typeof ResizeObserver === 'function') {
    let lastW = 0, raf = 0;
    const ro = new ResizeObserver(() => {
      updateDockHeight();
      const w = $('#view').clientWidth;
      if (w !== lastW) {
        lastW = w;
        if (!Store.ready) return;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          if (UI.mounted === 'insights') drawCharts(analyze(UI.period, UI.person));
          for (const el of $$('#view .chart[data-chart="flow"]')) flowChart(el, analyze(UI.period, 'all'));
          refractNow();
        });
      }
    });
    ro.observe($('#view'));
    ro.observe($('#dock'));
  }
}
const TABS = ['home', 'activity', 'plan', 'insights'];
function tabFromHash(h) { h = String(h || '').replace(/^#/, ''); if (h === 'budgets') h = 'plan'; return TABS.indexOf(h) >= 0 ? h : ''; }
/* your scene and glass, applied before anything else paints */
function applyLook() {
  applyScene(currentSceneId(), Prefs.motion && Prefs.fx !== 'saver');
  initGlass(Prefs.fx);
}
async function settleMe() {
  const before = currentSceneId(), fxBefore = Prefs.fx, motionBefore = Prefs.motion;
  await loadCloudPrefs();
  if (!Prefs.me && Store.mode === 'cloud') await savePrefs({ me: Store.isOwner ? 'p1' : 'p2' });
  if (currentSceneId() !== before || Prefs.fx !== fxBefore || Prefs.motion !== motionBefore) applyLook();
}
function boot(hot) {
  hot = hot || {};
  setCurrency(settings().currency);
  loadLocalPrefs();
  applyScene(currentSceneId(), Prefs.motion && Prefs.fx !== 'saver');
  if (bgInit() && BG.live) bgStart();
  initGlass(Prefs.fx);
  bindChrome();
  UI.tab = tabFromHash(location.hash) || tabFromHash(hot.tab) || 'home';
  if (hot.draft) $('#entry').value = String(hot.draft);
  rotatePlaceholder();
  autosize();
  syncDockButtons();
  storeOnChange(render);
  render();
  initStore().then(async () => {
    render();
    await settleMe();
    render();
    materializeRecurring();
    materializePlan();
    if ($('#entry').value) onEntryInput();
  });
  initAI();
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    c.use('downloads').then(d => { UI.downloads = d; }).catch(() => {});
    c.use('permissions').then(p => { UI.permissions = p; }).catch(() => {});
  }
  try { if (c && c.hot && typeof c.hot.snapshot === 'function') c.hot.snapshot(() => ({ draft: $('#entry').value, tab: UI.tab })); } catch (e) { /* optional */ }
}
(function start() {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot(hot && hot.data ? hot.data : {});
})();

})();
</script>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column pocket ledger — sticky month bar and tabs on top, the capture dock pinned at the bottom, ruled ledger rows in between */
:root {
  --paper: #eef2ee;
  --card: #fbfcfa;
  --sunk: #e2e8e3;
  --rule: #d4dcd5;
  --rule-2: #b8c3bb;
  --ink: #15201a;
  --ink-2: #435049;
  --ink-3: #5a6660;
  --accent: #1c5cab;
  --accent-ink: #ffffff;
  --accent-wash: #dce7f5;
  --in: #0a7340;
  --bad: #b3302a;
  --bad-wash: #f6e1df;
  --warn: #8a5200;
  --warn-wash: #f5e8d0;
  --good: #0a7340;
  --good-wash: #dcefe3;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --muted-line: #9ba69e;
  --budget-line: #5a6660;
  --grid: #e3e8e3;
  --seq-0: #e2e8e3; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #1c5cab;
  --hm-ink-1: #15201a; --hm-ink-2: #15201a; --hm-ink-3: #15201a; --hm-ink-4: #ffffff; --hm-ink-5: #ffffff;
  --shadow-dock: 0 12px 32px -14px rgba(21, 32, 26, .30), 0 1px 0 rgba(21, 32, 26, .04);
  --shadow-pop: 0 18px 40px -16px rgba(21, 32, 26, .35);
  --scrim: rgba(12, 18, 15, .42);
  --toast-bg: #15201a; --toast-ink: #f1f5f2; --toast-btn: rgba(255, 255, 255, .14);
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1210; --card: #151b18; --sunk: #1e2622; --rule: #29322d; --rule-2: #3b4641;
    --ink: #e6ece8; --ink-2: #b4bfb8; --ink-3: #909b95;
    --accent: #7cb0f2; --accent-ink: #0a1522; --accent-wash: #182a40;
    --in: #4cc78b; --bad: #f2786f; --bad-wash: #3a1f1d; --warn: #e8ae55; --warn-wash: #33291a; --good: #4cc78b; --good-wash: #16301f;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --muted-line: #5d6964; --budget-line: #909b95; --grid: #222a26;
    --seq-0: #1e2622; --seq-1: #104281; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
    --hm-ink-1: #e6ece8; --hm-ink-2: #e6ece8; --hm-ink-3: #ffffff; --hm-ink-4: #0a1522; --hm-ink-5: #0a1522;
    --shadow-dock: 0 12px 32px -12px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .03);
    --shadow-pop: 0 18px 40px -14px rgba(0, 0, 0, .7);
    --scrim: rgba(0, 0, 0, .55);
    --toast-bg: #e6ece8; --toast-ink: #111814; --toast-btn: rgba(0, 0, 0, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1210; --card: #151b18; --sunk: #1e2622; --rule: #29322d; --rule-2: #3b4641;
  --ink: #e6ece8; --ink-2: #b4bfb8; --ink-3: #909b95;
  --accent: #7cb0f2; --accent-ink: #0a1522; --accent-wash: #182a40;
  --in: #4cc78b; --bad: #f2786f; --bad-wash: #3a1f1d; --warn: #e8ae55; --warn-wash: #33291a; --good: #4cc78b; --good-wash: #16301f;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --muted-line: #5d6964; --budget-line: #909b95; --grid: #222a26;
  --seq-0: #1e2622; --seq-1: #104281; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
  --hm-ink-1: #e6ece8; --hm-ink-2: #e6ece8; --hm-ink-3: #ffffff; --hm-ink-4: #0a1522; --hm-ink-5: #0a1522;
  --shadow-dock: 0 12px 32px -12px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .03);
  --shadow-pop: 0 18px 40px -14px rgba(0, 0, 0, .7);
  --scrim: rgba(0, 0, 0, .55);
  --toast-bg: #e6ece8; --toast-ink: #111814; --toast-btn: rgba(0, 0, 0, .08);
  color-scheme: dark;
}

body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--paper); }
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.ic { display: inline-grid; place-items: center; flex: none; }
.ic svg, .icon-btn svg, .btn svg, .dock-btn svg, .chip svg, .ins-ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* frame */
.app { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(var(--dock-h, 92px) + 32px); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); padding-top: 8px; }
.top-row { display: flex; align-items: center; gap: 6px; min-height: 46px; }
.brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: var(--ink); }
.brand-mark { width: 26px; height: 26px; flex: none; }
.brand-mark rect { fill: var(--accent); }
.brand-mark path { stroke: var(--accent-ink); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -.015em; white-space: nowrap; }
.period { display: flex; align-items: center; }
.period-label { border: 0; background: none; font-weight: 650; font-size: 14px; padding: 6px 6px; border-radius: var(--r-s); text-align: center; white-space: nowrap; }
.period-label:hover { background: var(--sunk); }
.pl-short { display: none; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: 10px; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 0 9px; font-weight: 650; font-size: 14.5px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 430px) { .pl-long { display: none; } .pl-short { display: inline; } .tabs { gap: 18px; } }
@media (max-width: 350px) { .brand-name { display: none; } }

/* banners */
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 12px; margin-top: 12px; border-radius: 12px; background: var(--sunk); font-size: 13.5px; color: var(--ink-2); }
.banner .ic svg { width: 18px; height: 18px; }
.banner > span:nth-child(2) { flex: 1; min-width: 12em; }
.banner.tone-warn { background: var(--warn-wash); color: var(--warn); }
.banner.tone-info { background: var(--accent-wash); color: var(--ink); }

/* type */
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.sec { margin-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.sec-h { font-family: var(--font-display); font-weight: 650; font-size: 19px; letter-spacing: -.012em; margin: 0; }
.link { border: 0; background: none; color: var(--accent); font-weight: 650; font-size: 14px; padding: 4px 2px; text-align: left; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* hero */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; }
.hero { margin-top: 16px; padding: 18px 18px 16px; }
.hero-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.hero-num { font-weight: 650; font-size: clamp(40px, 11.5vw, 56px); letter-spacing: -.03em; line-height: 1.04; margin: 8px 0 14px; overflow-wrap: anywhere; }
.meter { position: relative; height: 10px; border-radius: 99px; background: var(--accent-wash); }
.meter > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--accent); max-width: 100%; }
.meter.tone-warn > span { background: var(--warn); }
.meter.tone-bad > span { background: var(--bad); }
.meter .pace { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.meter.sm { height: 6px; }
.meter.sm .pace { top: -4px; bottom: -4px; }
.hero-sub { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); }
.hero-stats dt { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.hero-stats dd { margin: 2px 0 0; font-weight: 650; font-size: 16.5px; overflow-wrap: anywhere; }
.hero-stats dd small { font-weight: 600; color: var(--ink-3); font-size: 12.5px; }
.in { color: var(--in); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 99px; font-size: 12.5px; font-weight: 650; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.chip svg { width: 14px; height: 14px; stroke-width: 2.2; }
.tone-good.chip { background: var(--good-wash); color: var(--good); }
.tone-warn.chip { background: var(--warn-wash); color: var(--warn); }
.tone-bad.chip { background: var(--bad-wash); color: var(--bad); }

/* insights */
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ins { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 12px 14px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-m); }
.ins-ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); }
.ins-ic svg { width: 18px; height: 18px; }
.ins.tone-good .ins-ic { background: var(--good-wash); color: var(--good); }
.ins.tone-warn .ins-ic { background: var(--warn-wash); color: var(--warn); }
.ins.tone-bad .ins-ic { background: var(--bad-wash); color: var(--bad); }
.ins-t { margin: 0; font-weight: 650; font-size: 14.5px; line-height: 1.35; }
.ins-b { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.ins .link { grid-column: 2; justify-self: start; padding: 2px 0 0; font-size: 13.5px; }
.tone-tag { font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; margin-right: 6px; }
.ins.tone-good .tone-tag { color: var(--good); }
.ins.tone-warn .tone-tag { color: var(--warn); }
.ins.tone-bad .tone-tag { color: var(--bad); }

/* ledger rows */
.day { margin-top: 16px; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 2px 6px; border-bottom: 1px solid var(--rule-2); font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.day-h .tot { letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.row { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; border-radius: 0; }
.row:hover { background: var(--card); }
.badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--rule); font-size: 19px; line-height: 1; }
.row-main { min-width: 0; }
.row-title { display: block; font-weight: 600; overflow-wrap: anywhere; }
.row-meta { display: block; font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.row-amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row.income .row-amt { color: var(--in); }
.row.k-transfer .row-amt, .row.k-transfer .row-title { color: var(--ink-3); }
.row-amt small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.row.flash { animation: flash 1.8s ease-out; }
@keyframes flash { from { background: var(--accent-wash); } to { background: transparent; } }
.grand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 4px 0; font-weight: 700; }
.grand .v { border-bottom: 3px double var(--ink); padding-bottom: 1px; font-variant-numeric: tabular-nums; }
.more { width: 100%; margin-top: 14px; }

/* empty + welcome */
.empty { text-align: left; padding: 28px 4px; color: var(--ink-2); }
.empty h3 { margin: 0 0 6px; font-size: 17px; color: var(--ink); }
.welcome { padding: 26px 0 4px; }
.welcome h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 8.4vw, 46px); line-height: 1.02; letter-spacing: -.03em; margin: 0; max-width: 13ch; }
.welcome .lede { font-size: 16px; color: var(--ink-2); max-width: 44ch; margin: 12px 0 0; }
.try { margin-top: 22px; display: grid; gap: 8px; }
.try-row { display: flex; flex-wrap: wrap; gap: 8px; }
.try-chip { font-family: var(--font-mono); font-size: 13px; border: 1px dashed var(--rule-2); background: var(--card); border-radius: 10px; padding: 8px 12px; color: var(--ink); text-align: left; }
.try-chip:hover { border-style: solid; border-color: var(--accent); }
.ways { list-style: none; padding: 0; margin: 24px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.way { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 12px; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); width: 100%; text-align: left; }
.way .ic { grid-row: span 2; width: 36px; height: 36px; border-radius: 10px; background: var(--accent-wash); color: var(--accent); }
.way b { font-size: 14px; }
.way span:last-child { font-size: 12.5px; color: var(--ink-3); }
.welcome-cta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 22px; }

/* buttons + fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--rule-2); background: var(--card); font-weight: 650; font-size: 14.5px; color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.field { display: grid; gap: 6px; margin-top: 14px; min-width: 0; }
.field > span, .lbl-s { font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.field small { font-size: 12px; color: var(--ink-3); }
.input, .field input:not([type="checkbox"]), .field select, .field textarea, .select { width: 100%; box-sizing: border-box; min-height: 44px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--rule-2); background: var(--paper); font-size: 16px; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--sunk); gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 16px; border-radius: 9px; font-weight: 650; color: var(--ink-2); font-size: 14px; }
.seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--rule-2); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.chip-btn:hover { border-color: var(--ink-3); }
.chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 6px; }
.cat-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); font-size: 12px; font-weight: 650; text-align: center; line-height: 1.2; color: var(--ink-2); }
.cat-opt .em { font-size: 22px; line-height: 1; }
.cat-opt:hover { border-color: var(--ink-3); }
.cat-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.amt-field { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--rule-2); padding: 4px 2px 6px; margin-top: 14px; }
.amt-field:focus-within { border-bottom-color: var(--accent); }
.amt-field .cur { font-size: 26px; color: var(--ink-3); font-weight: 600; }
.amt-field input { border: 0; background: none; font-size: 40px; font-weight: 650; width: 100%; min-width: 0; outline: none; letter-spacing: -.02em; padding: 0; }
.calc { min-height: 18px; font-size: 12.5px; color: var(--ink-3); margin: 6px 0 0; }
.switch { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 14px; font-size: 14.5px; cursor: pointer; }
.switch input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }
.note-box { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--warn-wash); color: var(--warn); font-size: 13.5px; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 18px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 58%, transparent); pointer-events: none; }
.dock-in { max-width: 760px; margin: 0 auto; display: grid; gap: 8px; pointer-events: auto; }

/* ---------- rebuild the entry map from documents + in-flight writes ---------- */

    for (const id of Object.keys(ents)) {
      const v = ents[id];
      if (!v || typeof v !== 'object') continue;
      const n = normEntry(id, v);
      const prev = map.get(id);
      if (!prev || n.updated >= prev.updated) { map.set(id, n); where.set(id, bid); }
    }
  }
  const now = Date.now();
  for (const [id, p] of Store.pending) {

    if (p.done && (settled || now - p.done > 20000)) { Store.pending.delete(id); continue; }

/* ---------- start-up ---------- */

      Store.buckets = new Map();

        if (!data) continue;

}
function loadDevice() {

/* ---------- writes ---------- */
function bucketFor(e) {
  const base = monthOf(e.date);
  const cur = Store.where.get(e.id);
  if (cur && cur.split('_')[0] === base) return cur;
  let k = base, n = 1;
  while ((Store.sizes.get(k) || 0) > BUCKET_LIMIT) { n++; k = base + '_' + n; }
  return k;
}
async function writeBucket(bid, patch) {
  if (Store.mode !== 'cloud') {

    const copy = { entries: Object.assign({}, b.entries) };
    for (const id in patch) { if (patch[id]) copy.entries[id] = patch[id]; else delete copy.entries[id]; }
    if (Object.keys(copy.entries).length) { Store.buckets.set(bid, copy); if (Store.mode === 'device' && !lsSet('ledger:' + bid, copy)) throw { code: 'quota_exceeded' }; }
    else { Store.buckets.delete(bid); lsDel('ledger:' + bid); }
    Store.sizes.set(bid, JSON.stringify(copy).length);
    return;
  }
  const ref = Store.db.doc('ledger/' + bid);
  return enqueue('ledger/' + bid, async () => {
    const attempt = async () => {
      if (Store.buckets.has(bid)) return ref.update({ entries: patch });
      const snap = await ref.get();
      if (snap.exists) return ref.update({ entries: patch });
      return ref.set({ entries: patch, v: 1 });
    };
    try { await attempt(); }
    catch (e) {
      if (!e || (e.code !== 'unavailable' && e.code !== 'invalid_argument')) throw e;
      await sleep(300 + Math.random() * 700);
      const snap = await ref.get();
      if (snap.exists) await ref.update({ entries: patch }); else await ref.set({ entries: patch, v: 1 });
    }

}
async function commitPatches(patches, ids) {

    for (const id of ids) { const p = Store.pending.get(id); if (p) p.done = now; }
    rebuildEntries(); storeEmit();

}
function addPatch(patches, bid, id, doc) { if (!patches.has(bid)) patches.set(bid, {}); patches.get(bid)[id] = doc; }
async function putEntries(list) {
  if (Store.readOnly) throw { code: 'read_only' };
  const patches = new Map(), ids = [];
  for (const e of list) {
    const target = bucketFor(e);
    const cur = Store.where.get(e.id);
    if (cur && cur !== target) addPatch(patches, cur, e.id, null);
    const doc = entryToDoc(e);
    addPatch(patches, target, e.id, doc);
    Store.where.set(e.id, target);
    Store.sizes.set(target, (Store.sizes.get(target) || 0) + JSON.stringify(doc).length + e.id.length + 6);
    if (Store.mode === 'cloud') Store.pending.set(e.id, { entry: e, bucket: target, done: 0 });
    ids.push(e.id);

}
async function deleteEntries(idList) {

async function metaReady() {

}
async function putMeta(name, data) {

/* ===================== model accessors + analytics ===================== */
function settings() {

    startDay: clamp(parseInt(s.startDay, 10) || 1, 1, 28),

}
const GROUPS = ['needs', 'wants', 'savings', 'transfer'];

    if (c.type === 'income') r.group = 'income';

    const o = sanitizeCat(over[id]);
    if (!o.name) continue;
    const type = o.type || 'expense';
    list.push(Object.assign({ id, emoji: '🏷️', type, group: type === 'income' ? 'income' : 'wants', custom: true }, o, { type, group: type === 'income' ? 'income' : (o.group || 'wants') }));

}
function catById(id, type) {

}
function groupOf(e) { return e.type === 'income' ? 'income' : (catById(e.cat, e.type).group || 'wants'); }
function budgets() {
  const b = Store.meta.budgets || {};

}

}
function parseCtx() { const s = settings(); return { today: todayStr(), dateOrder: s.dateOrder, cats: allCats(), rules: rulesMap() }; }

let SORTED = { v: -1, list: [] };
function sortedEntries() {
  if (SORTED.v !== Store.version) {
    SORTED = { v: Store.version, list: Array.from(Store.entries.values()).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created)) };
  }

}

const FIXED = new Set(['home', 'emi', 'insurance', 'bills', 'subs', 'edu', 'fees']);
function kindOf(e) {

}

    if (e.date > p.end) continue;
    if (e.date < p.start) break;
    r.count++; r.entries.push(e);
    const kind = kindOf(e);

    else if (kind === 'transfer') r.transfer += e.amount;

let ANALYSIS = { k: '', a: null };
function analyze(key) {
  const st = settings();
  const today = todayStr();
  const meta = Store.meta;
  const ck = [Store.version, key, st.startDay, today, meta.categories && meta.categories.rev, meta.budgets && meta.budgets.rev, meta.recurring && meta.recurring.rev, FMT.cur].join('|');

    byCat: cur.byCat, prevByCat: prev.byCat, avgCat, avgSpend, priorCount: prior.length,

function nextOccurrence(date, every, day) {

  if (every === 'yearly') return addMonths(date, 12, day);
  return addMonths(date, 1, day);
}
function monthlyEquivalent(amount, every) { return every === 'weekly' ? amount * 52 / 12 : every === 'yearly' ? amount / 12 : amount; }
function detectRepeating(list, rules, today) {
  const out = [], seen = new Set();
  for (const id in rules) {
    const r = rules[id];
    if (!r.active || r.tpl.type !== 'expense') continue;
    out.push({ name: r.tpl.note || catById(r.tpl.cat).name, cat: r.tpl.cat, monthly: monthlyEquivalent(+r.tpl.amount || 0, r.every), every: r.every, amount: +r.tpl.amount || 0, next: r.next, rule: id });
    seen.add(normText(r.tpl.merchant || r.tpl.note).trim());
  }
  const start = addDays(today, -100);
  const groups = new Map();
  for (const e of list) {
    if (e.date > today) continue;
    if (e.date < start) break;
    if (e.type !== 'expense' || e.rec || kindOf(e) === 'transfer') continue;
    const k = merchantKey(e);
    if (!k || seen.has(k)) continue;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }
  for (const [, g] of groups) {
    if (g.length < 2) continue;
    const months = new Set(g.map(e => monthOf(e.date)));
    if (months.size < 2 || g.length > months.size + 1) continue;
    const amts = g.map(e => e.amount), med = median(amts);
    if (!amts.every(v => Math.abs(v - med) <= med * 0.15)) continue;
    const dates = g.map(e => e.date).sort();
    let ok = true;
    for (let i = 1; i < dates.length; i++) { const gap = daysBetween(dates[i - 1], dates[i]); if (gap < 24 || gap > 37) ok = false; }
    if (!ok) continue;
    out.push({ name: g[0].merchant || g[0].note, cat: g[0].cat, monthly: med, every: 'monthly', amount: med, next: addMonths(dates[dates.length - 1], 1), rule: '' });
  }
  return out.sort((a, b) => b.monthly - a.monthly);
}

/* ---------- plain-language insights ---------- */
function buildInsights(A) {
  const out = [];
  const add = (score, tone, icon, title, body, action) => out.push({ score, tone, icon, title, body, action });
  const mon = A.isCurrent ? 'this month' : 'in ' + periodLabel(A.p);
  if (!A.count && !A.total) return out;
  if (A.budgetTotal) {
    const left = A.budgetTotal - A.spend;
    if (left < 0) add(100, 'bad', 'alert', 'Over budget by ' + money(-left), 'You have spent ' + money(A.spend) + ' of your ' + money(A.budgetTotal) + ' budget ' + mon + '.');
    else if (A.isCurrent && A.dayIndex >= 3 && A.projection > A.budgetTotal * 1.02) add(90, 'warn', 'trend', 'Heading ' + moneyR(A.projection - A.budgetTotal) + ' over budget', 'At your current pace this month ends near ' + money(niceRound(A.projection)) + '. Keeping to ' + moneyR(Math.max(0, left / Math.max(1, A.daysLeft + 1))) + ' a day gets you back under.');
    else if (A.isCurrent && A.dayIndex >= 3) add(50, 'good', 'check', 'On track for your budget', 'Projected ' + money(niceRound(A.projection)) + ' by month end, ' + moneyR(A.budgetTotal - A.projection) + ' under. You can spend about ' + moneyR(left / Math.max(1, A.daysLeft + 1)) + ' a day.');
  } else if (A.priorCount >= 1 && A.avgSpend > 0) {
    add(42, 'info', 'target', 'Set a monthly budget', 'You usually spend about ' + money(niceRound(A.avgSpend)) + ' a month. A budget near that turns on pace alerts.', { act: 'tab', arg: 'budgets', label: 'Set budget' });
  }
  for (const id in A.budgetCats) {
    const lim = A.budgetCats[id], c = A.byCat.get(id), spent = c ? c.total : 0, cat = catById(id);
    if (!cat) continue;
    if (spent > lim) add(95, 'bad', 'alert', cat.name + ' is over budget', money(spent) + ' spent of ' + money(lim) + ' ' + mon + '.');
    else if (A.isCurrent && spent >= lim * 0.8) add(80, 'warn', 'gauge', cat.name + ': ' + pct(spent / lim) + ' of budget used', money(lim - spent) + ' left with ' + A.daysLeft + (A.daysLeft === 1 ? ' day' : ' days') + ' to go.');
  }
  if (A.isCurrent && A.dayIndex >= 3 && A.prevToDate > 0) {
    const diff = (A.spend - A.prevToDate) / A.prevToDate;
    if (Math.abs(diff) >= 0.1) {
      const up = diff > 0;
      add(68 + Math.min(20, Math.abs(diff) * 40), up ? 'warn' : 'good', up ? 'up' : 'down', 'Spending is ' + pct(Math.abs(diff)) + (up ? ' higher' : ' lower') + ' than last month', money(A.spend) + ' so far, against ' + money(A.prevToDate) + ' by the same day last month.');
    }
  }
  if (A.priorCount >= 2) {
    let best = null;
    for (const [id, avg] of A.avgCat) {
      if (avg <= 0) continue;
      const c = A.byCat.get(id), now = c ? c.total : 0;
      const expected = A.isCurrent ? avg * (A.dayIndex / A.p.days) : avg;
      if (expected <= 0) continue;
      const ratio = now / expected, excess = now - expected;
      if (ratio >= 1.4 && excess >= Math.max(A.avgSpend * 0.04, 1) && (!best || excess > best.excess)) best = { id, ratio, excess, now, expected };
    }
    if (best) { const cat = catById(best.id); add(64, 'warn', 'up', cat.name + ' is running ' + pct(best.ratio - 1) + ' above usual', money(best.now) + ' ' + mon + ' against about ' + moneyR(best.expected) + ' by this point in a typical month.', { act: 'filter-cat', arg: best.id, label: 'See entries' }); }
  }
  if (A.savingsRate != null) {
    if (A.saved < 0) add(85, 'bad', 'alert', 'Spent ' + money(-A.saved) + ' more than you earned', 'Income ' + mon + ' is ' + money(A.income) + ' and spending is ' + money(A.spend) + '.');
    else if (A.savingsRate >= 0.2) add(55, 'good', 'piggy', 'You kept ' + pct(A.savingsRate) + ' of your income', money(A.saved) + ' not spent ' + mon + (A.invest ? ', including ' + money(A.invest) + ' invested' : '') + '. The usual target is 20% or more.');
    else add(60, 'warn', 'piggy', 'Saving ' + pct(A.savingsRate) + ' of income so far', 'The common target is 20%. That would mean keeping about ' + moneyR(A.income * 0.2 - A.saved) + ' more ' + mon + '.');
  }
  if (A.unusual) {
    const e = A.unusual.e, cat = catById(e.cat);
    add(52, 'info', 'spark', 'Unusual: ' + money(e.amount) + ' for ' + e.note, 'About ' + Math.round(A.unusual.ratio) + '× your typical ' + cat.name + ' expense of ' + moneyR(A.unusual.med) + '.', { act: 'edit', arg: e.id, label: 'View' });
  }
  if (A.subs.length) {
    const m = sum(A.subs, s => s.monthly);
    add(36, 'info', 'repeat', 'Repeating charges: ' + moneyR(m) + ' a month', A.subs.length + (A.subs.length === 1 ? ' charge' : ' charges') + ', about ' + moneyR(m * 12) + ' a year. Biggest: ' + A.subs[0].name + ' at ' + moneyR(A.subs[0].monthly) + '.');
  }
  if (A.biggest && A.spend > 0) add(30, 'info', 'receipt', 'Biggest expense: ' + A.biggest.note + ', ' + money(A.biggest.amount), pct(A.biggest.amount / A.spend) + ' of everything spent ' + mon + '.', { act: 'edit', arg: A.biggest.id, label: 'View' });
  if (A.weekendRatio >= 1.5 && A.weekdayDays >= 3) add(31, 'info', 'calendar', 'Weekends cost ' + (Math.round(A.weekendRatio * 10) / 10) + '× more per day', 'Day-to-day spending averages ' + money(niceRound((A.weekday[0] + A.weekday[6]) / 2)) + ' on weekend days and ' + money(niceRound((A.weekday[1] + A.weekday[2] + A.weekday[3] + A.weekday[4] + A.weekday[5]) / 5)) + ' on weekdays.');
  if (A.isCurrent && A.noSpendDays >= 3) add(20, 'good', 'leaf', A.noSpendDays + ' no-spend days so far', 'Days with nothing spent ' + mon + '.');
  if (A.topPlaces.length && A.topPlaces[0].count >= 3) add(24, 'info', 'pin', 'Most frequent: ' + A.topPlaces[0].name, A.topPlaces[0].count + ' times, ' + money(A.topPlaces[0].total) + ' in total ' + mon + '.');
  if (A.otherCount >= 3) add(44, 'info', 'tag', A.otherCount + ' entries have no clear category', 'Give them a category and your breakdown gets sharper. I will remember the choice next time.', { act: 'filter-cat', arg: 'other', label: 'Review' });
  if (A.transfer > 0 && A.count) {
    const atm = A.entries.filter(e => kindOf(e) === 'transfer' && /\batm\b|withdraw/i.test(e.note));
    if (atm.length) add(26, 'info', 'cash', 'Cash withdrawn: ' + money(sum(atm, e => e.amount)), 'Withdrawals are not counted as spending. Log what you buy with the cash to see where it goes.');
  }
  return out.sort((a, b) => b.score - a.score);
}
function niceRound(v) {
  if (v <= 0) return 0;
  const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 1));
  return Math.round(v / p) * p;
}
function periodLabel(p) {
  const sd = settings().startDay;
  if (sd === 1) return fmtDate(p.start, { month: 'long', year: 'numeric' });
  return shortDate(p.start) + ' – ' + shortDate(p.end);
}
function periodShort(p) {
  const sd = settings().startDay;
  return sd === 1 ? fmtDate(p.start, { month: 'short' }) : shortDate(p.start);
}

/* ---------- a compact summary Claude can read ---------- */
function buildDigest(A) {
  const n = v => String(Math.round(v * 100) / 100);
  const L = [];
  L.push('Today: ' + A.today + '. Currency: ' + FMT.cur + '. Budget months start on day ' + settings().startDay + '.');
  L.push('Selected period: ' + A.p.start + ' to ' + A.p.end + (A.isCurrent ? ' (day ' + A.dayIndex + ' of ' + A.p.days + ')' : '') + '.');
  L.push('This period: spent ' + n(A.spend) + ', income ' + n(A.income) + ', invested ' + n(A.invest) + ', transfers and card bills (not spending) ' + n(A.transfer) + ', entries ' + A.count + '.' + (A.isCurrent ? ' Projected spending by period end: ' + n(A.projection) + '.' : ''));
  L.push('Previous period: spent ' + n(A.prevSpend) + ', income ' + n(A.prevIncome) + (A.isCurrent ? ', spent by the same day: ' + n(A.prevToDate) : '') + '.');
  const cats = Array.from(A.byCat.entries()).filter(([, v]) => v.kind !== 'income').sort((a, b) => b[1].total - a[1].total).slice(0, 14)
    .map(([id, v]) => catById(id).name + ' ' + n(v.total) + ' (prev ' + n((A.prevByCat.get(id) || { total: 0 }).total) + ', 3-mo avg ' + n(A.avgCat.get(id) || 0) + ')');
  if (cats.length) L.push('Outflow by category this period: ' + cats.join('; ') + '.');
  const inc = Array.from(A.byCat.entries()).filter(([, v]) => v.kind === 'income').map(([id, v]) => catById(id).name + ' ' + n(v.total));
  if (inc.length) L.push('Income by category: ' + inc.join('; ') + '.');
  L.push('Last 6 periods (start date: spent / income): ' + A.hist.map(h => h.p.start + ': ' + n(h.spend) + ' / ' + n(h.income)).join('; ') + '.');
  if (A.budgetTotal) L.push('Monthly budget: ' + n(A.budgetTotal) + '.');
  const bc = Object.keys(A.budgetCats).map(id => catById(id).name + ' ' + n(A.budgetCats[id]) + ' (spent ' + n((A.byCat.get(id) || { total: 0 }).total) + ')');
  if (bc.length) L.push('Category budgets: ' + bc.join('; ') + '.');
  if (A.subs.length) L.push('Repeating charges (monthly equivalent): ' + A.subs.slice(0, 10).map(s => s.name + ' ' + n(s.monthly)).join('; ') + '.');
  if (A.topPlaces.length) L.push('Top places this period: ' + A.topPlaces.map(t => t.name + ' ' + n(t.total) + ' (' + t.count + 'x)').join('; ') + '.');
  L.push('Ledger holds ' + A.total + ' entries' + (A.firstDate ? ' since ' + A.firstDate : '') + '.');
  return L.join('\n');
}

/* ===================== charts: SVG + HTML, theme tokens, hover tooltips, table views ===================== */
function niceScale(max, count) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const raw = max / (count || 4);
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * pow).find(s => s >= raw) || pow * 10;
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 1e-6; v += step) ticks.push(Math.round(v * 100) / 100);
  return { max: top, ticks };
}
const f1 = v => Math.round(v * 10) / 10;

/* one tooltip for every chart; content is set with textContent */
function showTip(clientX, clientY, title, rows) {
  const el = document.getElementById('tip');
  if (!el) return;
  el.textContent = '';
  if (title) { const h = document.createElement('div'); h.className = 'tip-title'; h.textContent = title; el.appendChild(h); }
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'tip-row';
    if (r.color) { const k = document.createElement('span'); k.className = 'tip-key' + (r.dashed ? ' dashed' : ''); k.style.setProperty('--k', r.color); row.appendChild(k); }
    const v = document.createElement('strong'); v.textContent = r.value; row.appendChild(v);
    const l = document.createElement('span'); l.className = 'tip-label'; l.textContent = r.label; row.appendChild(l);
    el.appendChild(row);
  }
  el.hidden = false;
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = clientX + 14, top = clientY - h - 14;
  if (left + w > window.innerWidth - 8) left = clientX - w - 14;
  if (left < 8) left = 8;
  if (top < 8) top = clientY + 18;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
function hideTip() { const el = document.getElementById('tip'); if (el) el.hidden = true; }
function svgPoint(svg, ev, W) { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * (W / r.width); }
function colPath(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${f1(x)},${f1(y + h)}V${f1(y + r)}Q${f1(x)},${f1(y)} ${f1(x + r)},${f1(y)}H${f1(x + w - r)}Q${f1(x + w)},${f1(y)} ${f1(x + w)},${f1(y + r)}V${f1(y + h)}Z`;
}
function chartWidth(el) { return Math.max(260, Math.floor(el.clientWidth || el.getBoundingClientRect().width || 320)); }

/* cumulative spending this period vs last period, budget line and projection */
function paceChart(el, A) {
  const W = chartWidth(el), H = 224, m = { l: 46, r: 14, t: 18, b: 28 };
  const N = A.p.days, n = A.isCurrent ? A.dayIndex : (A.isFuture ? 0 : N);
  const prevN = Math.min(A.prevCum.length, N);
  const proj = A.isCurrent && n < N ? A.projection : 0;
  const sc = niceScale(Math.max(n ? A.cum[n - 1] : 0, prevN ? A.prevCum[prevN - 1] : 0, A.budgetTotal || 0, proj, 1) * 1.04, 4);
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = d => m.l + (N <= 1 ? 0 : (d - 1) / (N - 1) * iw);
  const y = v => m.t + ih - (v / sc.max) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Running total of spending this period compared with last period">`;
  for (const t of sc.ticks) s += `<line class="grid${t === 0 ? ' base' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(t))}" y2="${f1(y(t))}"/><text class="tick" x="${m.l - 8}" y="${f1(y(t) + 4)}" text-anchor="end">${esc(compact(t))}</text>`;
  const xd = N > 2 ? [1, Math.ceil(N / 2), N] : [1, N];
  for (const d of xd) s += `<text class="tick" x="${f1(x(d))}" y="${H - 8}" text-anchor="${d === 1 ? 'start' : d === N ? 'end' : 'middle'}">${esc(shortDate(addDays(A.p.start, d - 1)))}</text>`;
  if (A.budgetTotal) s += `<line class="ln-budget" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(A.budgetTotal))}" y2="${f1(y(A.budgetTotal))}"/><text class="lbl halo" x="${m.l + 6}" y="${f1(y(A.budgetTotal) - 7)}">Budget ${esc(compact(A.budgetTotal))}</text>`;
  if (prevN) {
    let d = '';
    for (let i = 1; i <= prevN; i++) d += (i === 1 ? 'M' : 'L') + f1(x(i)) + ',' + f1(y(A.prevCum[i - 1]));
    s += `<path class="ln-prev" d="${d}"/>`;
  }
  if (n) {
    let d = '';
    for (let i = 1; i <= n; i++) d += (i === 1 ? 'M' : 'L') + f1(x(i)) + ',' + f1(y(A.cum[i - 1]));
    s += `<path class="area-cur" d="${d}L${f1(x(n))},${f1(y(0))}L${f1(x(1))},${f1(y(0))}Z"/><path class="ln-cur" d="${d}"/>`;
  }
  const ex = n ? x(n) : 0, ey = n ? y(A.cum[n - 1]) : 0;
  let projLabel = null;
  if (proj && n) {
    s += `<path class="ln-proj" d="M${f1(ex)},${f1(ey)}L${f1(x(N))},${f1(y(proj))}"/>`;
    projLabel = { x: x(N), y: y(proj) - 9 };
    s += `<text class="lbl halo" x="${f1(projLabel.x)}" y="${f1(Math.max(12, projLabel.y))}" text-anchor="end">${esc(compact(proj))} projected</text>`;
  }
  if (n) {
    s += `<circle class="dot-ring" cx="${f1(ex)}" cy="${f1(ey)}" r="6"/><circle class="dot-cur" cx="${f1(ex)}" cy="${f1(ey)}" r="4"/>`;
    const clash = projLabel && Math.abs(projLabel.y - (ey - 12)) < 16 && Math.abs(projLabel.x - ex) < 120;
    if (!clash) s += `<text class="lbl halo strong" x="${f1(ex + (ex > W - 90 ? -10 : 10))}" y="${f1(Math.max(12, ey - 10))}" text-anchor="${ex > W - 90 ? 'end' : 'start'}">${esc(compact(A.cum[n - 1]))}</text>`;
  }
  s += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><g class="hov"></g><rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H - m.b}"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xhair'), hov = svg.querySelector('.hov');
  const move = ev => {
    const d = clamp(Math.round((svgPoint(svg, ev, W) - m.l) / iw * (N - 1)) + 1, 1, N);
    xh.setAttribute('x1', f1(x(d))); xh.setAttribute('x2', f1(x(d))); xh.setAttribute('visibility', 'visible');
    const rows = [];
    let dots = '';
    if (d <= n) { rows.push({ label: 'this period', value: money(A.cum[d - 1]), color: 'var(--series-1)' }); dots += `<circle class="dot-ring" cx="${f1(x(d))}" cy="${f1(y(A.cum[d - 1]))}" r="6"/><circle class="dot-cur" cx="${f1(x(d))}" cy="${f1(y(A.cum[d - 1]))}" r="4"/>`; }
    else if (proj) { const pv = A.cum[n - 1] + (proj - A.cum[n - 1]) * (d - n) / (N - n); rows.push({ label: 'projected', value: money(niceRound(pv)), color: 'var(--series-1)', dashed: true }); }
    if (d <= prevN) { rows.push({ label: 'last period', value: money(A.prevCum[d - 1]), color: 'var(--muted-line)' }); dots += `<circle class="dot-ring" cx="${f1(x(d))}" cy="${f1(y(A.prevCum[d - 1]))}" r="5"/><circle class="dot-prev" cx="${f1(x(d))}" cy="${f1(y(A.prevCum[d - 1]))}" r="3.5"/>`; }
    if (A.budgetTotal) rows.push({ label: 'budget', value: money(A.budgetTotal), color: 'var(--budget-line)' });
    hov.innerHTML = dots;
    showTip(ev.clientX, ev.clientY, dayLabel(addDays(A.p.start, d - 1)) + ' · day ' + d, rows);
  };
  const out = () => { xh.setAttribute('visibility', 'hidden'); hov.innerHTML = ''; hideTip(); };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', out);
}
function paceTable(A) {
  const N = A.p.days, n = A.isCurrent ? A.dayIndex : (A.isFuture ? 0 : N);
  let r = '<table class="tbl"><thead><tr><th>Day</th><th>Spent that day</th><th>Running total</th><th>Last period</th></tr></thead><tbody>';
  for (let d = 1; d <= Math.max(n, 1) && d <= N; d++) r += `<tr><td>${esc(shortDate(addDays(A.p.start, d - 1)))}</td><td>${money(A.daily[d - 1] || 0)}</td><td>${money(A.cum[d - 1] || 0)}</td><td>${d <= A.prevCum.length ? money(A.prevCum[d - 1]) : '–'}</td></tr>`;
  return r + '</tbody></table>';
}

/* six periods: spending and income side by side */
function trendChart(el, A) {
  const W = chartWidth(el), H = 214, m = { l: 46, r: 8, t: 22, b: 28 };
  const first = A.hist.findIndex(h => h.spend > 0 || h.income > 0);
  const data = A.hist.slice(Math.max(0, Math.min(first < 0 ? A.hist.length : first, A.hist.length - 3)));
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const sc = niceScale(Math.max(1, ...data.map(h => Math.max(h.spend, h.income))) * 1.08, 4);
  const y = v => m.t + ih - (v / sc.max) * ih;
  const band = iw / data.length, bw = Math.max(5, Math.min(18, band * 0.3));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Spending and income per month">`;
  for (const t of sc.ticks) s += `<line class="grid${t === 0 ? ' base' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(t))}" y2="${f1(y(t))}"/><text class="tick" x="${m.l - 8}" y="${f1(y(t) + 4)}" text-anchor="end">${esc(compact(t))}</text>`;
  data.forEach((h, i) => {
    const cx = m.l + band * (i + 0.5);

/* light markdown → safe HTML for answers */
function mdLite(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  let html = '', list = '';
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>');
  const close = () => { if (list) { html += '</' + list + '>'; list = ''; } };
  for (const raw of lines) {
    const l = raw.trim();
    let m;
    if (!l) { close(); continue; }
    if ((m = /^[-•*]\s+(.*)$/.exec(l))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if ((m = /^\d+[.)]\s+(.*)$/.exec(l))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    close();
    if ((m = /^#{1,4}\s+(.*)$/.exec(l))) { html += '<p><strong>' + inline(m[1]) + '</strong></p>'; continue; }
    html += '<p>' + inline(l) + '</p>';
  }
  close();
  return html;
}

function matchQuery(e, q) {
  if (/^[\d.,₹$€£\s]+$/.test(q)) {
    const n = parseFloat(q.replace(/[^\d.]/g, ''));
    if (n > 0) return Math.abs(e.amount - n) < 0.005 || String(e.amount).indexOf(String(n)) === 0;
  }
  const hay = (e.note + ' ' + e.merchant + ' ' + e.method + ' ' + catById(e.cat, e.type).name + ' ' + e.tags.map(t => '#' + t).join(' ')).toLowerCase();
  return q.split(/\s+/).every(w => hay.indexOf(w) >= 0);
}
function activityList() {

  if (!q) { const p = periodFromKey(UI.period, settings().startDay); list = list.filter(e => e.date >= p.start && e.date <= p.end); }
  if (UI.act.type !== 'all') list = list.filter(e => e.type === UI.act.type);
  if (UI.act.cat) list = list.filter(e => e.cat === UI.act.cat);
  if (q) list = list.filter(e => matchQuery(e, q));

}

async function askSubmit(q) {

    aiNoteError(e);
    if (e && e.text) UI.ask.turns.push({ role: 'assistant', content: e.text + (e.code === 'cancelled' ? '' : '\n\n*Interrupted. Ask again to retry.*') });
    else if (!e || e.code !== 'cancelled') UI.ask.err = aiErrorText(e);

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg, actions, ms) {
  if (!msg) return;
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  const t = document.createElement('span');
  t.textContent = msg;
  el.appendChild(t);
  const done = () => { clearTimeout(toastTimer); if (el.parentNode) el.parentNode.removeChild(el); };
  for (const a of actions || []) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = a.label;
    b.addEventListener('click', () => { done(); a.run(); });
    el.appendChild(b);
  }
  root.textContent = '';
  root.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(done, ms || 4200);
}

async function submitEntry(source) {
  const el = $('#entry');
  const text = el.value.trim();
  if (!text || UI.busy) return;
  clearTimeout(parseTimer);
  const r = parseText(text, parseCtx());
  UI.draft = r;
  if (r.kind === 'command') return runCommand(r.command);
  let drafts = r.entries.map((d, i) => (UI.slipOver[i] ? Object.assign({}, d, UI.slipOver[i]) : d));
  if (aiReady() && (r.needsAI || drafts.some(d => !d.amount))) {
    UI.busy = true;
    renderSlips();
    UI.aiCtl = new AbortController();
    try {
      const ai = await aiParseText(text, UI.aiCtl.signal);
      if (ai.length) {
        ai.forEach((a, i) => {
          const o = ai.length === drafts.length ? UI.slipOver[i] : null;
          if (o && o.cat) { a.cat = o.cat; a.type = catById(o.cat).type; a.catLocked = true; }
          if (ai.length === drafts.length) a.tags = drafts[i].tags || [];
        });
        drafts = ai;
      }
    } catch (e) {
      aiNoteError(e);
      if (e && e.code !== 'cancelled' && !drafts.some(d => d.amount)) toast(aiErrorText(e));
    } finally {
      UI.busy = false;
      UI.aiCtl = null;
    }
  }
  drafts = drafts.filter(d => d.amount > 0);
  if (!drafts.length) { renderSlips(); nudge('I couldn’t find an amount. Try something like “' + exampleTry()[0] + '”.'); return; }
  if (el.value.trim() === text) { el.value = ''; UI.draft = null; UI.slipOver = {}; autosize(); syncDockButtons(); }
  renderSlips();
  const src = source || (r.source === 'sms' ? 'sms' : 'text');
  await saveDrafts(drafts.map(d => Object.assign({}, d, { source: src })), src);
}
async function runCommand(cmd) {
  if (cmd.kind !== 'budget') return;
  if (!cmd.cat && cmd.unknown) { nudge('There is no category called “' + cmd.unknown + '”. Try one like food, groceries or shopping.'); return; }
  const b = budgets();
  const nb = { total: b.total, cats: Object.assign({}, b.cats), sample: false };

const Voice = { on: false, rec: null, failed: false, supported: typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition) };
function setMicUI(on) {
  const b = $('#mic-btn');
  b.classList.toggle('listening', on);
  b.innerHTML = on ? ICON.stop : ICON.mic;
  b.setAttribute('aria-label', on ? 'Stop listening' : 'Speak an entry');

function dictationCoach() {
  const el = $('#entry');
  el.focus();
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const mac = /Mac/i.test(navigator.platform || navigator.userAgent || '');
  const msg = coarse ? 'Tap the microphone on your keyboard and say it, like “lunch 250 at Subway”.'
    : mac ? 'Press the Globe key or Fn twice to dictate, then say something like “lunch 250 at Subway”.'
      : 'Press Windows + H to dictate, then say something like “lunch 250 at Subway”.';
  const c = $('#coach');
  c.innerHTML = ic('mic') + '<span>' + esc(msg) + '</span>';
  c.hidden = false;

}
function toggleVoice() {
  if (Voice.on) { try { Voice.rec.stop(); } catch (e) { /* ignore */ } return; }
  if (!Voice.supported || Voice.failed) { dictationCoach(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec;
  try { rec = new SR(); } catch (e) { Voice.failed = true; dictationCoach(); return; }
  rec.lang = FMT.cur === 'INR' ? 'en-IN' : (navigator.language || 'en-US');
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = '', heard = false;
  const el = $('#entry');
  const before = el.value.trim();
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    heard = true;
    el.value = (before ? before + ' ' : '') + (finalText + ' ' + interim).trim();
    onEntryInput();
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') { Voice.failed = true; dictationCoach(); }
    else if (ev.error === 'no-speech') nudge('I didn’t hear anything. Tap the mic and try again.');
  };
  rec.onend = () => {
    Voice.on = false; Voice.rec = null; setMicUI(false);
    if (heard && finalText.trim()) { onEntryInput(); if (settings().voiceAuto) setTimeout(() => submitEntry('voice'), 120); }
  };
  try { rec.start(); Voice.on = true; Voice.rec = rec; setMicUI(true); hideCoach(); }
  catch (e) { Voice.failed = true; dictationCoach(); }
}

/* ===================== actions: saving, learning, repeating, examples ===================== */
function storeErrorText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Storage is full. Download a backup, then delete old entries to make room.';
  if (c === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  if (c === 'read_only' || c === 'revoked') return 'This ledger is read-only right now. Reload the page to continue.';
  if (c === 'invalid_argument') return 'Only the owner of this ledger can change it.';
  return 'Couldn’t save that. Check your connection and try again.';
}
function ensureSettingsSaved() {
  if (Store.meta.settings || !Store.metaLoaded) return;
  saveSettings({}).catch(() => {});
}
async function saveSettings(patch) {
  await metaReady();
  const cur = Object.assign({}, Store.meta.settings || {});
  delete cur.rev;
  const s = settings();
  const next = Object.assign({ currency: s.currency, startDay: s.startDay, ai: s.ai, voiceAuto: s.voiceAuto, dateOrder: s.dateOrder }, cur, patch);
  await putMeta('settings', next);
}
async function saveBudgets(b) {
  await metaReady();
  const cats = {};
  for (const k in (b.cats || {})) if (+b.cats[k] > 0) cats[k] = round2(+b.cats[k]);
  await putMeta('budgets', { total: +b.total > 0 ? round2(+b.total) : 0, cats, sample: !!b.sample });
}
function recurringRaw() { return Object.assign({}, (Store.meta.recurring && Store.meta.recurring.items) || {}); }
async function saveRecurring(list) {
  await metaReady();
  const items = recurringRaw();
  for (const r of list) items[r.id] = r;
  await putMeta('recurring', { items });
}
async function removeRecurring(ids) {
  await metaReady();
  const items = recurringRaw();
  for (const id of ids) delete items[id];
  await putMeta('recurring', { items });
}
function makeRule(d) {
  const day = +d.date.slice(8);
  return { id: uid('r'), every: d.repeat, day, start: d.date, next: nextOccurrence(d.date, d.repeat, day), active: true,
    tpl: { type: d.type, amount: d.amount, cat: d.cat, note: d.note, merchant: d.merchant || '', method: d.method || '', tags: d.tags || [] } };
}
let materializing = false;
async function materializeRecurring() {
  if (materializing || !Store.ready || Store.readOnly) return;
  materializing = true;
  try {
    const items = recurringItems(), today = todayStr(), now = Date.now();
    const out = [], changed = [];
    for (const id in items) {
      const r = items[id];
      if (!r.active) continue;
      let next = r.next, n = 0;
      while (next <= today && n < 60) {
        const eid = 'r-' + r.id + '-' + next;
        if (!Store.entries.has(eid)) out.push(normEntry(eid, Object.assign({}, r.tpl, { date: next, source: 'recurring', rec: r.id, created: now + n, updated: now + n })));
        next = nextOccurrence(next, r.every, r.day);
        n++;
      }
      if (next !== r.next) changed.push(Object.assign({}, r, { next }));
    }
    if (out.length) await putEntries(out);
    if (changed.length) await saveRecurring(changed);
    if (out.length) toast('Added ' + plural(out.length, 'repeating entry', 'repeating entries') + ' that came due');
  } catch (e) { /* tried again on the next visit */ }
  finally { materializing = false; }
}

/* learned shortcuts: "starbucks" → food */
const RULE_STOP = /^(?:paid|bill|bills|payment|online|order|expense|misc|other|money|cash|upi|card|transfer|entry|bank debit|bank credit|from|to|the)$/;
function ruleKeyFor(e) {
  const src = (e.merchant || '').trim() || e.note || '';
  let k = normText(src).trim().replace(/\b(?:at|from|to|for|on|in|the|a|an|my|with|and|of)\b/g, ' ').replace(/[\d§]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!e.merchant) k = k.split(' ').filter(w => w.length > 1).slice(0, 2).join(' ');
  if (!k || k.length < 3 || RULE_STOP.test(k)) return '';
  return k.slice(0, 40);
}
async function learnRules(pairs) {
  await metaReady();
  const map = Object.assign({}, rulesMap());
  for (const [k, c] of pairs) if (k) map[k] = c;
  const keys = Object.keys(map);
  if (keys.length > 500) for (const k of keys.slice(0, keys.length - 500)) delete map[k];
  await putMeta('rules', { map });
}

async function saveDrafts(drafts, source, quiet) {
  const now = Date.now();
  const entries = [], rules = [], recs = [];
  drafts.forEach((d, i) => {
    let rec = '';
    if (d.repeat) { const r = makeRule(d); recs.push(r); rec = r.id; }
    const e = normEntry(uid('t'), Object.assign({}, d, { source: d.source || source || 'text', rec, created: now + i, updated: now + i, sample: false }));
    entries.push(e);
    if (d.catLocked) { const k = ruleKeyFor(e); if (k) rules.push([k, e.cat]); }
  });
  try {
    await putEntries(entries);
    if (recs.length) await saveRecurring(recs);
    if (rules.length) await learnRules(rules);
    ensureSettingsSaved();
  } catch (e) { toast(storeErrorText(e)); return []; }
  flashIds(entries.map(e => e.id));
  if (!IN_CLAUDE && Store.mode === 'device' && navigator.storage && navigator.storage.persist && !uiFlag('persist-asked')) { uiFlag('persist-asked', true); navigator.storage.persist().catch(() => {}); }
  const sd = settings().startDay;
  const otherPeriod = entries.length && periodKeyFor(entries[0].date, sd) !== UI.period;
  if (!quiet) {
    const label = entries.length === 1 ? addedLabel(entries[0]) : 'Added ' + entries.length + ' entries';
    UI.undo = async () => {
      try { await deleteEntries(entries.map(e => e.id)); if (recs.length) await removeRecurring(recs.map(r => r.id)); toast('Removed'); }
      catch (e) { toast(storeErrorText(e)); }
    };
    const acts = [{ label: 'Undo', run: () => UI.undo && UI.undo() }];
    if (entries.length === 1) acts.push({ label: 'Edit', run: () => { const e = Store.entries.get(entries[0].id); if (e) openEditor(e); } });
    else if (otherPeriod) acts.push({ label: 'Show', run: () => { UI.period = periodKeyFor(entries[0].date, sd); UI.periodTouched = true; setTab('activity'); } });
    toast(label + (otherPeriod && entries.length === 1 ? ' · ' + dayLabel(entries[0].date) : ''), acts, 6500);
  }
  return entries;
}
function addedLabel(e) {
  const c = catById(e.cat, e.type), k = kindOf(e);
  return (e.type === 'income' ? 'Added income ' : 'Added ') + money(e.amount) + ' · ' + c.name + (k === 'invest' ? ' (saving)' : k === 'transfer' ? ' (not spending)' : '');
}
async function updateEntry(prev, next) {
  const e = normEntry(prev.id, Object.assign({}, prev, next, { updated: Math.max(Date.now(), prev.updated + 1) }));
  try { await putEntries([e]); } catch (err) { toast(storeErrorText(err)); return null; }
  flashIds([e.id]);
  if (e.cat !== prev.cat) {
    const key = ruleKeyFor(e);
    if (key) {
      learnRules([[key, e.cat]]).catch(() => {});
      const similar = Array.from(Store.entries.values()).filter(x => x.id !== e.id && x.cat === prev.cat && x.type === e.type && ruleKeyFor(x) === key);
      if (similar.length) {
        toast('Saved. I’ll file “' + key + '” under ' + catById(e.cat).name + ' from now on.', [{ label: 'Move ' + similar.length + ' more', run: async () => {
          try { await putEntries(similar.map(x => normEntry(x.id, Object.assign({}, x, { cat: e.cat, updated: Date.now() })))); toast('Moved ' + plural(similar.length, 'entry', 'entries')); }
          catch (err) { toast(storeErrorText(err)); }
        } }], 8000);
        return e;
      }
      toast('Saved. I’ll file “' + key + '” under ' + catById(e.cat).name + ' from now on.');
      return e;
    }
  }
  toast('Saved');
  return e;
}
async function removeEntry(e) {
  try { await deleteEntries([e.id]); } catch (err) { toast(storeErrorText(err)); return; }
  toast('Deleted ' + e.note, [{ label: 'Undo', run: async () => { try { await putEntries([normEntry(e.id, Object.assign({}, e, { updated: Date.now() }))]); } catch (err) { toast(storeErrorText(err)); } } }], 6500);
}

  closeSheet(true);
  hideTip();
  const root = $('#sheet-root');
  root.innerHTML = '<div class="scrim" data-act="close-sheet"></div><div class="sheet' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.label || 'Dialog') + '">' + html + '</div>';
  root.hidden = false;
  document.body.classList.add('sheet-open');
  SHEET.onClose = opts.onClose || null;
  if (!SHEET.open) SHEET.prevFocus = document.activeElement;
  SHEET.open = true;
  const sheet = root.querySelector('.sheet');
  if (opts.onMount) opts.onMount(sheet);
  requestAnimationFrame(() => {
    const f = sheet.querySelector('[autofocus]') || sheet.querySelector('.sh-head .icon-btn');
    if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  });
  return sheet;
}
function closeSheet(silent) {
  if (!SHEET.open) return;
  const cb = SHEET.onClose;
  SHEET.onClose = null; SHEET.open = false;
  const root = $('#sheet-root');
  root.innerHTML = ''; root.hidden = true;
  document.body.classList.remove('sheet-open');
  if (cb) { try { cb(); } catch (e) { /* ignore */ } }
  if (silent !== true && SHEET.prevFocus && SHEET.prevFocus.isConnected) { try { SHEET.prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
function sheetHead(title) { return '<header class="sh-head"><h2>' + esc(title) + '</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">' + ICON.x + '</button></header>'; }

/* ---------- entry editor ---------- */
let ED = null;
function evalAmount(s) {
  let t = String(s || '').replace(/[,\s₹$€£¥]/g, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
  t = t.replace(/(\d+(?:\.\d+)?)k/gi, '($1*1000)').replace(/(\d+(?:\.\d+)?)(?:lakhs?|lacs?|l)/gi, '($1*100000)');
  if (!t) return 0;
  if (!/^[\d.+\-*/()]+$/.test(t)) return parseFloat(t) || 0;
  let i = 0;
  const peek = () => t[i];
  const num = () => { const st = i; while (i < t.length && /[\d.]/.test(t[i])) i++; return parseFloat(t.slice(st, i)); };
  const factor = () => { if (peek() === '(') { i++; const v = expr(); if (peek() === ')') i++; return v; } if (peek() === '-') { i++; return -factor(); } return num(); };
  const term = () => { let v = factor(); while (peek() === '*' || peek() === '/') { const op = t[i++]; const r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const op = t[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; }
  const v = expr();
  return Number.isFinite(v) && v > 0 ? round2(v) : 0;
}
function catGridHTML(type, sel) {
  return allCats().filter(c => c.type === type && (!c.hidden || c.id === sel)).map(c => '<button type="button" class="cat-opt" data-act="ed-cat" data-arg="' + esc(c.id) + '" aria-pressed="' + (c.id === sel) + '"><span class="em" aria-hidden="true">' + esc(c.emoji) + '</span>' + esc(c.name) + '</button>').join('');
}

  ED = { isNew: !existing, orig: existing || null, d, autoCat: d.cat, catTouched: false, foreign: opts.foreign || '', source: d.source || 'manual', raw: opts.raw || '' };
  openSheet(editorHTML(), { label: ED.isNew ? 'New entry' : 'Edit entry', onMount: bindEditor });
}

    '<div class="field"><span>Paid with</span><div class="chips" id="ed-methods">' + METHODS.map(m => '<button type="button" class="chip-btn" data-act="ed-method" data-arg="' + esc(m) + '" aria-pressed="' + (d.method === m) + '">' + esc(m) + '</button>').join('') + '</div></div>' +
    (isNew ? '<div class="field"><span>Repeats</span><div class="chips" id="ed-repeat">' + reps.map(r => '<button type="button" class="chip-btn" data-act="ed-repeat" data-arg="' + r[0] + '" aria-pressed="' + ((d.repeat || '') === r[0]) + '">' + r[1] + '</button>').join('') + '</div></div>'

function bindEditor(sheet) {
  const amt = $('#ed-amount', sheet), calc = $('#ed-calc', sheet);
  const show = () => {
    calc.classList.remove('err');
    const v = evalAmount(amt.value);
    calc.textContent = /[+*/x×()]|\d-\d/.test(amt.value) && v ? '= ' + money(v) : 'Sums work too, like 120+80.';
  };
  amt.addEventListener('input', show);
  for (const id of ['#ed-amount', '#ed-note', '#ed-merchant', '#ed-tags']) $(id, sheet).addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); editorSave(); } });
}
function readEditor() {
  const d = ED.d;
  d.amount = evalAmount($('#ed-amount').value);
  d.note = $('#ed-note').value.trim();
  const dv = $('#ed-date').value;
  if (isYMD(dv)) d.date = dv;
  d.merchant = $('#ed-merchant').value.trim();
  d.tags = ($('#ed-tags').value.match(/#?[A-Za-z0-9_-]+/g) || []).map(t => t.replace(/^#/, '').toLowerCase()).slice(0, 8);
  return d;
}
async function editorSave() {
  if (!ED) return;
  const d = readEditor();
  if (!(d.amount > 0)) { const c = $('#ed-calc'); c.textContent = 'Enter an amount above zero.'; c.classList.add('err'); $('#ed-amount').focus(); return; }
  if (!d.cat || catById(d.cat, d.type).type !== d.type) {
    const guess = catFromText(d.note + ' ' + d.merchant, d.type, parseCtx());
    d.cat = guess.cat;
  }
  if (!d.note) d.note = d.merchant || catById(d.cat, d.type).name;
  if (ED.isNew) {
    const raw = ED.raw;
    const src = ED.source;
    const drafts = [Object.assign({}, d, { catLocked: ED.catTouched && d.cat !== ED.autoCat, source: src })];
    closeSheet();
    const saved = await saveDrafts(drafts, src);
    if (saved.length && raw) {
      const el = $('#entry');
      if (el.value.indexOf(raw) >= 0) { el.value = el.value.replace(raw, '').replace(/^[\s,;&]+|[\s,;&]+$/g, '').replace(/^(?:and|plus)\s+|\s+(?:and|plus)$/i, ''); onEntryInput(); }
    }
  } else {
    const prev = ED.orig;
    closeSheet();
    await updateEntry(prev, { type: d.type, amount: d.amount, cat: d.cat, date: d.date, note: d.note, merchant: d.merchant, method: d.method, tags: d.tags });
  }
}

/* ---------- receipts and screenshots ---------- */
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function handleImage(file) {
  if (!file) return;
  if (!/^image\//.test(file.type || '')) { toast('That file isn’t an image. Choose a photo or screenshot.'); return; }
  if (!(aiReady() && AI.images)) { toast(AI.ok ? 'Reading photos needs Claude access, which is off right now.' : 'Reading photos needs Claude, which isn’t available in this view.'); return; }
  const ctl = new AbortController();
  let url = '';
  try { url = await readAsDataURL(file); } catch (e) { /* preview is optional */ }
  openSheet(sheetHead('Reading your receipt') + '<div class="sh-body"><div class="scan">' + (url ? '<img src="' + esc(url) + '" alt="The image you chose">' : '') + '<div class="scanline"></div></div>' +
    '<p class="sh-lede" id="scan-status" style="margin-top:12px">Claude is looking for the total, the date and the shop…</p></div>', { label: 'Reading receipt', onClose: () => ctl.abort() });
  try {
    const res = await aiReadImage(file, ctl.signal);
    if (ctl.signal.aborted) return;
    if (!res.drafts.length) { const s = $('#scan-status'); if (s) s.textContent = 'I couldn’t find a payment in that image. Try a sharper photo, or type it in the box below.'; const l = $('.scanline'); if (l) l.remove(); return; }
    const ds = res.drafts.map(d => Object.assign(d, { source: 'receipt' }));
    closeSheet(true);
    if (ds.length === 1) openEditor(ds[0], { foreign: res.foreign });
    else openImportDrafts(ds, 'receipt');
  } catch (e) {
    aiNoteError(e);
    if (e && e.code === 'cancelled') return;
    const s = $('#scan-status');
    if (s) s.textContent = aiErrorText(e) || 'That didn’t work. Try again.';
    const l = $('.scanline'); if (l) l.remove();
  }
}

/* ---------- import: bank messages, CSV statements, backups ---------- */
const IMP = { tab: 'sms', text: '', drafts: [], picked: [], dup: [], csv: null, backup: null, source: '' };
function openImport(tab, text) {
  Object.assign(IMP, { tab: tab || 'sms', text: text || '', drafts: [], picked: [], dup: [], csv: null, backup: null, source: '' });
  openSheet(sheetHead(tab === 'preview' ? 'Check and add' : 'Import entries') + '<div class="sh-body" id="imp-body"></div><footer class="sh-foot" id="imp-foot"></footer>', {
    label: 'Import entries', wide: true,
    onMount: () => { renderImport(); if (IMP.text && IMP.tab === 'sms') importRead(); }
  });
}
function openImportDrafts(drafts, source) { openImport('preview'); IMP.drafts = drafts; IMP.source = source; markDups(); renderImport(); }
function markDups() {
  const idx = new Map();
  for (const e of Store.entries.values()) { const k = e.type + '|' + Math.round(e.amount * 100); if (!idx.has(k)) idx.set(k, []); idx.get(k).push(e.date); }
  const seen = new Map();
  IMP.dup = IMP.drafts.map(d => {
    const k = d.type + '|' + Math.round(d.amount * 100);
    const a = idx.get(k);
    const inLedger = !!(a && a.some(x => Math.abs(daysBetween(x, d.date)) <= 1));
    const sk = k + '|' + d.date + '|' + normText(d.note).trim();
    const inBatch = seen.has(sk);
    seen.set(sk, true);
    return inLedger || inBatch;
  });
  IMP.picked = IMP.dup.map(x => !x);
}
function catOptions(type, sel) {
  return allCats().filter(c => c.type === type && (!c.hidden || c.id === sel)).map(c => '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.emoji + '  ' + c.name) + '</option>').join('');
}

function importRead() {

async function readCSVFile(file) {

  const rows = parseCSV(text);
  const res = csvToDrafts(rows, parseCtx());
  IMP.csv = { name: file.name, rows, error: res.error || (res.drafts.length ? '' : 'No rows with both a date and an amount were found.'), positiveIsExpense: res.positiveIsExpense, signedHint: !!(res.map && res.map.amount != null && res.map.debit == null && res.map.credit == null && res.map.type == null) };
  IMP.drafts = res.drafts.map(d => Object.assign(d, { source: 'csv' }));

function rerunCSV(positiveIsExpense) {
  if (!IMP.csv || !IMP.csv.rows) return;
  const res = csvToDrafts(IMP.csv.rows, parseCtx(), { positiveIsExpense });
  IMP.csv.positiveIsExpense = positiveIsExpense;
  IMP.drafts = res.drafts.map(d => Object.assign(d, { source: 'csv' }));
  markDups();
  renderImport();
}
async function readBackupFile(file) {

  try { obj = JSON.parse(await file.text()); } catch (e) { obj = null; }
  if (!obj || obj.app !== 'pocket-ledger' || !Array.isArray(obj.entries)) { IMP.backup = { error: 'That file isn’t a Pocket Ledger backup.' }; renderImport(); return; }
  const fresh = obj.entries.filter(x => x && typeof x.id === 'string' && /^[\w.~:@+-]{1,120}$/.test(x.id) && !Store.entries.has(x.id));
  IMP.backup = { obj, fresh, total: obj.entries.length, withMeta: !Store.entries.size };
  renderImport();
}

async function restoreBackup() {

  if (!b || b.error) return;
  const list = b.fresh.map(x => normEntry(x.id, x));
  try {
    if (list.length) await putEntries(list);
    if (b.withMeta) for (const n of META_NAMES) if (b.obj[n] && typeof b.obj[n] === 'object') { const d = Object.assign({}, b.obj[n]); delete d.rev; await putMeta(n, d); }

}

async function deleteCat(id) {
  const c = catById(id);
  const fallback = c.type === 'income' ? 'other_in' : 'other';
  const moved = Array.from(Store.entries.values()).filter(e => e.cat === id).map(e => normEntry(e.id, Object.assign({}, e, { cat: fallback, updated: Date.now() })));
  const items = Object.assign({}, (Store.meta.categories && Store.meta.categories.items) || {});
  delete items[id];
  const map = Object.assign({}, rulesMap());
  let rulesChanged = false;
  for (const k in map) if (map[k] === id) { delete map[k]; rulesChanged = true; }
  const b = budgets();
  try {
    if (moved.length) await putEntries(moved);
    await putMeta('categories', { items });
    if (rulesChanged) await putMeta('rules', { map });
    if (b.cats[id]) { delete b.cats[id]; await saveBudgets(b); }
  } catch (e) { toast(storeErrorText(e)); return; }
  openCategories();
  toast('Deleted “' + c.name + '”' + (moved.length ? '. ' + plural(moved.length, 'entry', 'entries') + ' moved to ' + catById(fallback).name : ''));
}

async function openPermissions() {
  if (UI.permissions && typeof UI.permissions.manage === 'function') {
    try { await UI.permissions.manage(); AI.blocked = ''; UI.mounted = ''; render(); return; } catch (e) { /* fall through */ }
  }

}

/* ===================== wiring + start-up ===================== */
function currentSlip(i) {
  const r = UI.draft;
  if (!r || r.kind !== 'entries' || !r.entries[i]) return null;
  return UI.slipOver[i] ? Object.assign({}, r.entries[i], UI.slipOver[i]) : r.entries[i];
}
const ACT = {
  'close-sheet': () => closeSheet(),
  tab: a => { closeSheet(true); setTab(a); },
  edit: a => { const e = Store.entries.get(a); if (e) openEditor(e); },
  'filter-cat': a => { UI.act = { q: '', type: 'all', cat: a }; UI.actLimit = 300; if (UI.mounted === 'activity') { const q = $('#act-q'); if (q) q.value = ''; } setTab('activity'); },
  'act-type': a => { UI.act.type = a; UI.actLimit = 300; updateActivity(); },
  'act-more': () => { UI.actLimit += 300; updateActivity(); },
  'act-clear': () => { UI.act = { q: '', type: 'all', cat: '' }; const q = $('#act-q'); if (q) q.value = ''; updateActivity(); },
  try: a => { closeSheet(true); const el = $('#entry'); el.value = a; onEntryInput(); el.focus(); },
  examples: () => loadExamples(),
  'clear-examples': () => { closeSheet(true); clearExamples(); },
  'focus-entry': () => { closeSheet(true); $('#entry').focus(); },
  voice: () => { closeSheet(true); toggleVoice(); },
  scan: () => { closeSheet(true); $('#file-img').click(); },
  'import-sms': () => openImport('sms'),
  'import-csv': () => { openImport('csv'); $('#file-csv').click(); },
  'open-import': () => openImport('sms'),
  'new-entry': () => openEditor(null),
  'new-repeat': () => openEditor({ repeat: 'monthly' }),
  'slip-cat': a => {
    const i = +a, d = currentSlip(i);
    if (!d) return;
    openCatPicker(d.cat, id => { UI.slipOver[i] = Object.assign({}, UI.slipOver[i], { cat: id, type: catById(id).type, catLocked: true }); renderSlips(); $('#entry').focus(); });
  },
  'slip-edit': a => { const d = currentSlip(+a); if (d) openEditor(Object.assign({}, d, { source: 'text' }), { raw: d.raw }); },
  'toggle-table': a => { UI.tables[a] = !UI.tables[a]; updateInsights(); },
  'ask-sugg': a => askSubmit(a),
  'ask-stop': () => { if (UI.ask.ctl) UI.ask.ctl.abort(); },
  'ask-clear': () => { UI.ask = { turns: [], busy: false, ctl: null, live: '', err: '' }; renderAsk(); const q = $('#ask-q'); if (q) q.focus(); },
  review: () => runReview(false),
  'review-refresh': () => runReview(true),
  'review-stop': () => { if (UI.review.ctl) UI.review.ctl.abort(); },
  'open-permissions': () => openPermissions(),
  'hide-device-note': () => { uiFlag('device-note', true); renderBanner(); },
  'install-app': async () => { const ev = INSTALL_EVT; if (!ev) return; INSTALL_EVT = null; try { ev.prompt(); const r = await ev.userChoice; if (r && r.outcome === 'accepted') toast('Installed. Find Pocket Ledger with your apps.'); } catch (e) { /* dismissed */ } closeSheet(); },
  settings: () => openSettings(),
  'budget-edit': a => openBudgetEditor(a || ''),
  'budget-add': () => openBudgetAdd(),
  'budget-suggest': () => openBudgetSuggest(),
  'budget-save': a => budgetSave(a || ''),
  'budget-remove': a => budgetRemove(a || ''),
  'budget-apply': () => budgetApply(),
  'ed-type': a => {
    if (!ED) return;
    readEditor();
    ED.d.type = a;
    if (ED.d.cat && catById(ED.d.cat, a).type !== a) ED.d.cat = '';
    for (const b of $$('[data-act="ed-type"]')) b.setAttribute('aria-checked', String(b.dataset.arg === a));
    $('#ed-cats').innerHTML = catGridHTML(a, ED.d.cat);
  },
  'ed-cat': a => { if (!ED) return; ED.d.cat = a; ED.catTouched = true; for (const b of $$('#ed-cats .cat-opt')) b.setAttribute('aria-pressed', String(b.dataset.arg === a)); },
  'ed-method': a => { if (!ED) return; ED.d.method = ED.d.method === a ? '' : a; for (const b of $$('#ed-methods .chip-btn')) b.setAttribute('aria-pressed', String(b.dataset.arg === ED.d.method)); },
  'ed-repeat': a => { if (!ED) return; ED.d.repeat = a; for (const b of $$('#ed-repeat .chip-btn')) b.setAttribute('aria-pressed', String(b.dataset.arg === a)); },
  'ed-save': () => editorSave(),
  'ed-delete': () => { if (!ED || !ED.orig) return; const e = ED.orig; closeSheet(); removeEntry(e); },
  'ed-duplicate': () => { if (!ED || !ED.orig) return; const d = readEditor(); const copy = Object.assign({}, d, { id: '', date: todayStr(), rec: '', repeat: '' }); delete copy.id; closeSheet(true); openEditor(copy); },
  'imp-tab': a => { IMP.tab = a; IMP.drafts = []; IMP.picked = []; IMP.dup = []; renderImport(); },
  'imp-read': () => importRead(),
  'imp-file': () => $('#file-csv').click(),
  'imp-json': () => $('#file-json').click(),
  'imp-sign': a => rerunCSV(a === 'exp'),
  'imp-all': () => { IMP.picked = IMP.drafts.map(() => true); renderImport(); },
  'imp-none': () => { IMP.picked = IMP.drafts.map(() => false); renderImport(); },
  'imp-save': () => importSave(),
  'imp-restore': () => restoreBackup(),
  'open-cats': () => openCategories(),
  'open-recurring': () => openRecurringManager(),
  'open-rules': () => openRulesManager(),
  'export-csv': () => offerFile('pocket-ledger-' + todayStr() + '.csv', buildCSV()),
  'export-json': () => offerFile('pocket-ledger-backup-' + todayStr() + '.json', buildBackup()),
  wipe: () => openWipe(),
  'wipe-go': async () => {
    closeSheet(true);
    try { await wipeAll(); } catch (e) { toast(storeErrorText(e)); return; }
    UI.ask = { turns: [], busy: false, ctl: null, live: '', err: '' };
    UI.review = { busy: false, text: '', err: '', ctl: null, key: '' };
    toast('Everything was deleted');
  },
  help: () => openHelp(),
  'cat-new': () => openCatEdit(''),
  'cat-edit': a => openCatEdit(a),
  'cat-save': () => saveCatEdit(),
  'cat-delete': a => deleteCat(a),
  'ce-type': a => {
    CE.type = a;
    for (const b of $$('[data-act="ce-type"]')) b.setAttribute('aria-checked', String(b.dataset.arg === a));
    const w = $('#ce-group-wrap'); if (w) w.hidden = a === 'income';
  },
  'rec-toggle': a => recToggle(a),
  'rec-delete': a => recDelete(a),
  'rule-forget': a => ruleForget(a),
  'copy-text': () => {
    const ta = $('#copy-text');

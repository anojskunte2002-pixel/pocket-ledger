<title>Pocket Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/*STYLES*/
</style>
<!--BODY-->
<div id="bg-fallback" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="bg-veil" aria-hidden="true"></div>
<svg id="lg-defs" aria-hidden="true" focusable="false" width="0" height="0"></svg>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="top-row">
      <button class="hh" type="button" data-act="household" aria-label="Household and people">
        <span class="avatars" id="avatars"></span>
        <span class="hh-text"><b id="hh-title">Pocket Ledger</b><small id="hh-sub">Your money, one line at a time</small></span>
      </button>
      <div class="period glass-c" role="group" aria-label="Month">
        <button class="icon-btn" id="prev-period" type="button" aria-label="Previous month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="period-label" id="period-label" type="button">…</button>
        <button class="icon-btn" id="next-period" type="button" aria-label="Next month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <button class="icon-btn glass-c" id="open-look" type="button" data-act="appearance" aria-label="Background and look"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 9.8C22 6 17.5 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></svg></button>
      <button class="icon-btn glass-c" id="open-settings" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
    </div>
    <div class="people" id="people" role="radiogroup" aria-label="Whose money to show" hidden></div>
  </header>
  <div id="banner"></div>
  <main id="view" class="view" tabindex="-1">
    <section class="loading" aria-busy="true">
      <p class="eyebrow">Opening your ledger</p>
      <div class="ghost-num"></div>
      <div class="ghost-bar"></div>
      <p>Your entries, plan and insights will appear here. To add one, type something like <b>coffee 120</b> below.</p>
    </section>
  </main>
</div>
<div class="dock" id="dock">
  <div class="dock-in">
    <div class="coach" id="coach" role="status" hidden></div>
    <div class="slips" id="slips" aria-live="polite" hidden></div>
    <nav class="lbar glass refract" id="lbar" aria-label="Sections and quick add">
      <div class="tabs">
        <span class="tab-thumb" aria-hidden="true"></span>
        <button type="button" data-tab="home"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></button>
        <button type="button" data-tab="activity"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></span><span>Activity</span></button>
        <button type="button" data-tab="plan"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15.5l2 2 4-4"/></svg></span><span>Plan</span></button>
        <button type="button" data-tab="insights"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg></span><span>Insights</span></button>
      </div>
      <form class="capture" id="capture" autocomplete="off">
        <button type="button" class="dock-btn" id="add-btn" aria-label="More ways to add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <label class="sr" for="entry">Add an entry</label>
        <textarea id="entry" rows="1" placeholder="Add" enterkeyhint="send" autocapitalize="sentences" spellcheck="false"></textarea>
        <button type="button" class="dock-btn" id="mic-btn" aria-label="Speak an entry"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="submit" class="dock-btn primary" id="send-btn" aria-label="Add entry" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </form>
    </nav>
  </div>
</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="sheet-root" hidden></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-csv" accept=".csv,.txt,text/csv,text/plain" hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<script>
/*SCRIPT*/
</script>
